<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Trading">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Trading App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens taken from the web terminal's dark theme (--tl-colors-*) */
:root{
  --bg:#000;            /* surface-body */
  --l1:#0E0E11;         /* gray-950 / surface-layer-1 */
  --l2:#17171C;         /* gray-900 / surface-layer-2 */
  --l3:#26262C;         /* gray-800 / border-muted */
  --l4:#42424D;         /* gray-700 / border */
  --fg:#D3D3D9;         /* gray-200 */
  --strong:#fff;
  --muted:#9191A1;      /* gray-400 */
  --green:#00B28F;      /* green-500 */
  --green-solid:#008F72;/* green-600 */
  --green-bg:#001A15;   /* green-950 */
  --red:#EB4757;        /* red-500 */
  --red-solid:#CF3545;  /* red-600 */
  --red-bg:#260508;     /* red-950 */
  --brand:#4772F5;      /* violet-500 */
  --brand-solid:#195BE1;/* violet-600 */
  --brand-bg:#071032;   /* violet-950 */
  --purple:#7A5AF0;
  --sans:'Geist',system-ui,-apple-system,sans-serif;
  --num:'Geist',system-ui,-apple-system,sans-serif;   /* numbers: Geist with tabular figures (rule below); charts keep Geist Mono */
  --st:env(safe-area-inset-top,0px);
  --hb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
/* every digit the same width, so prices don't shift on ticks; !important because each `font:` shorthand resets it */
*{font-variant-numeric:tabular-nums !important}
html,body{margin:0;height:100%;background:#000}
body{font-family:var(--sans);color:var(--fg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
/* pinned to the real window edges: 100dvh can lag behind in full screen / home-screen mode and leave a gap under the menu */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

/* fake iOS status bar — only inside the desktop phone frame */
.statusbar{display:none}
.phone.kb{--hb:0px}   /* keyboard up: no home-indicator padding above it */
.phone.kb .ibar,.phone.kb .nav,.phone.kb .homebar{display:none}   /* nor tab bars: the room goes to the field being edited */
.homebar{flex:none;height:max(0px, calc(var(--hb) - 14px));background:var(--l2)}   /* the menu's own bottom padding covers part of the home-indicator zone */

@media (min-width:600px) and (min-height:640px){
  body{background:radial-gradient(1200px 700px at 50% 20%,#15161c 0%,#050506 60%)}
  .stage{padding:24px}
  .phone{width:393px;height:min(852px,calc(100dvh - 48px));border-radius:54px;
    box-shadow:0 0 0 10px #18181d,0 0 0 11px #2e2e36,0 40px 100px rgba(0,0,0,.7);
    --st:54px;--hb:30px}
  .statusbar{display:flex;flex:none;height:54px;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;color:#fff;font:600 17px var(--sans)}
  .statusbar .sicons{display:flex;gap:6px;align-items:center}
}

/* header */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top,0px)) 14px 10px 6px}
.phone .statusbar + .top{padding-top:6px}
.icbtn{width:48px;height:48px;display:grid;place-items:center;background:none;border:0;color:var(--strong);border-radius:12px;padding:0}
.icbtn svg{width:28px;height:28px}
.icbtn:active{background:var(--l2)}
.hright{display:flex;align-items:center;gap:10px}
.pnl{display:flex;align-items:center;gap:6px;background:none;border:0;padding:8px 2px;font:600 22px var(--num);letter-spacing:-.01em}
.pnl svg{width:12px;height:12px}
.vdiv{width:1px;height:30px;background:var(--l3)}
.ring{width:46px;height:46px;position:relative;display:grid;place-items:center;background:none;border:0;padding:0;color:var(--strong);font:600 15px var(--num)}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.acct{display:flex;height:48px;background:none;border:0;padding:0}
.demo{width:22px;background:var(--purple);color:#fff;display:grid;place-items:center;border-radius:7px 0 0 7px}
.demo span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 11px var(--sans);letter-spacing:.1em}
.logo{width:48px;background:#000;display:grid;place-items:center;position:relative;border:1px solid var(--l3);border-left:0;border-radius:0 8px 8px 0}
.logo svg{width:26px;height:26px;color:#fff}
.logo i{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--green)}

/* home tabs: star + text tabs with an underline */
.tabs{flex:none;border-bottom:1px solid var(--l3)}
.tabs[hidden]{display:none}
.tabs-scroll{position:relative;display:flex;overflow-x:auto;padding:0 6px;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab{flex:none;height:52px;padding:0 13px;background:none;border:0;color:var(--fg);font:500 18px var(--sans);white-space:nowrap}
.tab.on{color:var(--strong)}
.tab.star{display:grid;place-items:center;padding:0 12px;color:var(--muted)}
.tab.star svg{width:27px;height:27px}
.tab.star.on{color:var(--strong)}
.tab-ind{position:absolute;left:0;bottom:0;width:0;height:3px;border-radius:2px 2px 0 0;background:#fff}
.tabs-scroll.ready .tab-ind{transition:transform .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1)}

/* scroll area */
.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}

/* list header */
.lhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px;font:500 14px var(--sans);color:var(--muted)}

/* instrument rows */
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:74px;padding:12px 16px;background:none;border:0;text-align:left;position:relative}
.row:active{background:var(--l1)}
.row + .row::before{content:'';position:absolute;top:0;left:70px;right:16px;height:1px;background:#16161b}
.ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--icfg,#fff);font:700 18px var(--sans);letter-spacing:-.02em}
.ic.sm{font-size:13px}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sym{display:flex;align-items:center;gap:6px;font:600 17px var(--sans);color:var(--strong)}
.sym svg{flex:none;width:15px;height:15px;color:var(--brand)}
.desc{font:400 14px var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:92px}
.price{font:500 17px var(--num);color:var(--strong);font-variant-numeric:tabular-nums;transition:color .6s}
.chg{font:500 14px var(--num);font-variant-numeric:tabular-nums}
.up{color:var(--green)} .dn{color:var(--red)}
.fu{color:var(--green)!important;transition:none!important}
.fd{color:var(--red)!important;transition:none!important}
.chg .sep{font-style:normal;margin:0 5px;color:var(--muted)}
@media (max-width:350px){.row .chg{font-size:13px} .chg .sep{margin:0 3px}}

/* empty state / placeholders */
.empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 32px 64px;gap:12px}
.empty>svg{width:60px;height:60px;color:var(--brand)}
.empty h2{margin:10px 0 0;font:600 25px var(--sans);color:var(--strong)}
.empty p{margin:0;max-width:310px;font:400 17px/1.45 var(--sans);color:var(--muted)}
.empty .btn{margin-top:14px}
.ph .ico{width:76px;height:76px;border-radius:22px;background:var(--l2);border:1px solid var(--l3);display:grid;place-items:center;color:#fff}
.ph .ico svg{width:38px;height:38px}
.soon{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--brand);background:var(--brand-bg);border:1px solid #10235f;padding:5px 10px;border-radius:999px}

.btn{height:54px;padding:0 24px;border-radius:13px;border:1px solid var(--l4);background:transparent;color:var(--strong);font:600 17px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{background:var(--l2)}
.btn.solid{background:#fff;border-color:#fff;color:#000}
.btn.wide{width:100%}
.btn svg{width:22px;height:22px}

/* news: sentiment bar · headline · ↗ · tickers • time • sentiment • source */
.news{display:flex;flex-direction:column;gap:10px;padding:14px 16px 20px}
.card{position:relative;padding:14px 46px 14px 28px;border-radius:16px;background:var(--l2);cursor:pointer}
.card:active{background:var(--l3)}
.card::before{content:'';position:absolute;left:13px;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--sent)}
.card.pos{--sent:var(--green)} .card.neg{--sent:var(--red)} .card.neu{--sent:var(--l4)}
.card h3{margin:0 0 10px;font:500 18px/1.38 var(--sans);color:var(--strong)}
.card .go{position:absolute;top:14px;right:14px;width:24px;height:24px;color:var(--muted)}
.meta{font:400 14px/1.5 var(--sans);color:var(--muted)}
.meta .dot{margin:0 2px 0 6px}
.meta .nw{white-space:nowrap}
.meta .s-pos{color:var(--green)} .meta .s-neg{color:var(--red)} .meta .s-neu{color:var(--fg)}
.tkl{padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.tkl:active{color:var(--strong)}

/* bottom nav */
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--l2);border-top:1px solid var(--l3);padding:8px 2px 6px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;background:none;border:0;color:var(--muted);font:500 13px var(--sans)}
.nav button.on{color:var(--strong)}
.nav svg{width:28px;height:28px}
.nav .home svg{width:36px;height:36px;padding:3px;margin-top:-8px}.badge{position:absolute;top:-2px;left:calc(50% + 5px);min-width:22px;height:22px;padding:0 5px;border-radius:11px;border:2px solid var(--l2);background:var(--brand-solid);color:#fff;font:600 12px var(--sans);display:grid;place-items:center}

/* bottom sheet */
.backdrop{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.64);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;max-height:90%;overflow-y:auto;background:var(--l2);border:1px solid var(--l3);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + var(--hb));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.sheet-open .backdrop{opacity:1;pointer-events:auto}
.sheet-open .sheet{transform:none}
/* drag handle: a band pinned to the top of the sheet, content scrolls under it (the pill is drawn by ::before) */
.grab{position:sticky;top:-10px;z-index:3;height:31px;margin:-10px -16px 0;background:var(--l2)}
.grab::before{content:'';position:absolute;top:10px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:3px;background:var(--l4)}

.big{font:600 38px var(--num);color:var(--strong);letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .6s}
.range{margin:18px 0 0}
.range-l{display:flex;justify-content:space-between;font:500 13px var(--sans);color:var(--muted);margin-bottom:8px}
.range-bar{position:relative;height:6px;border-radius:3px;background:var(--l3)}
.range-bar i{position:absolute;top:-5px;width:4px;height:16px;border-radius:2px;background:#fff;transform:translateX(-50%);transition:left .4s}
.range-v{display:flex;justify-content:space-between;font:500 14px var(--num);color:var(--fg);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stat{background:var(--l1);border:1px solid var(--l3);border-radius:12px;padding:10px 12px}
.stat span{display:block;font:400 13px var(--sans);color:var(--muted);margin-bottom:3px}
.stat b{font:600 17px var(--num);color:var(--strong)}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trade button{height:66px;border:0;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 18px var(--sans)}
.trade button:active{filter:brightness(.9)}
.trade small{font:500 15px var(--num);opacity:.92}
.sell{background:var(--red-solid)} .buy{background:var(--green-solid)}
.sheet .btn.wide{margin-top:10px}
/* Add to Home Screen hint */
.a2-dev{display:inline-flex;align-items:center;height:28px;margin-bottom:16px;padding:0 10px;border-radius:8px;background:var(--l3);font:500 13px var(--sans);color:var(--fg)}
.a2-install{margin:0 0 16px!important}
.a2-steps{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none;counter-reset:a2}
.a2-steps li{display:flex;align-items:flex-start;gap:12px;counter-increment:a2;font:400 15px/1.5 var(--sans);color:var(--fg)}
.a2-steps li::before{content:counter(a2);flex:none;width:26px;height:26px;border-radius:50%;background:var(--l3);color:var(--strong);font:600 13px/26px var(--sans);text-align:center}
.a2-steps b{font-weight:600;color:var(--strong)}
.a2-ic{display:inline-grid;place-items:center;width:24px;height:24px;margin:0 2px;border-radius:6px;background:var(--l3);color:var(--strong);vertical-align:-6px}
.a2-ic svg{width:16px;height:16px}
.sheet .a2-skip{margin-top:20px;border-color:var(--l3);background:var(--l3)}

.acc-top{display:flex;align-items:center;gap:10px}
.acc-top b{font:600 19px var(--sans);color:var(--strong)}
.acc-top span{font:400 15px var(--sans);color:var(--muted)}
.stat b.up{color:var(--green)} .stat b.dn{color:var(--red)}
.acc-top .dpill{background:var(--purple);color:#fff;font:700 12px var(--sans);letter-spacing:.08em;padding:4px 8px;border-radius:6px}
.eq{margin:20px 0 2px;font:400 15px var(--sans);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 6px}

/* instrument screen (pushed full screen, not a modal) */
.inst{position:absolute;top:var(--st);left:0;right:0;bottom:0;z-index:15;display:flex;flex-direction:column;background:var(--bg);
  transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.inst-open .inst{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
/* one-line header: [icon SYMBOL ⌄ ...... price change] [x] */
.ihead{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-bottom:1px solid var(--l3)}
.ipick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:50px;padding:0 8px;background:none;border:0;border-radius:12px;text-align:left}
.ipick:active{background:var(--l2)}
.ipick .ic{width:32px;height:32px;font-size:15px}
.ipick .ic.sm{font-size:11px}
.t1{display:flex;align-items:center;gap:2px;font:600 17px var(--sans);color:var(--strong);white-space:nowrap}
.t1 svg{width:18px;height:18px;color:var(--muted)}
.t2{margin-left:auto;font:600 17px var(--num);color:var(--strong);white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .6s}
.t3{font-size:14px;white-space:nowrap}
.ihead .sclose{width:44px;height:44px}
.ihead .sclose svg{width:24px;height:24px}
@media (max-width:360px){.ipick .ic{display:none} .t2{font-size:16px}}

/* bottom segmented control of the instrument screen (icons only) */
.ibar{flex:none;padding:8px 16px calc(8px + var(--hb))}
.iseg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding:3px;background:var(--l2);border:1px solid var(--l3);border-radius:13px}
.ibtn{position:relative;z-index:1;height:38px;display:grid;place-items:center;padding:0;background:none;border:0;color:var(--muted);transition:color .2s}
.ibtn svg{width:24px;height:24px}
.ibtn.on{color:var(--strong)}
.ibar-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / 4);background:var(--l3);border:1px solid var(--l4);border-radius:10px;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.iview{flex:1;min-height:0;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.iview input{user-select:text;-webkit-user-select:text}
.ipages{display:flex;height:100%;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.ipage{flex:0 0 100%;height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.ipage::-webkit-scrollbar{display:none}
#pChart{display:flex;flex-direction:column}
/* chart: Lightweight Charts with our own toolbar, legend and settings sheet */
.ctool{flex:none;display:flex;align-items:center;gap:6px;height:44px;padding:0 8px 0 10px;border-bottom:1px solid var(--l2)}
.tfs{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tfs::-webkit-scrollbar{display:none}
.tf{flex:none;height:32px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--muted);font:500 14px var(--sans)}
.tf.on{background:var(--l3);color:var(--strong)}
.ctb{position:relative;flex:none;width:38px;height:36px;display:grid;place-items:center;padding:0;border:0;border-radius:9px;background:none;color:var(--fg)}
.ctb svg{width:22px;height:22px}
.tf:active,.ctb:active{background:var(--l2)}
.chartbox{flex:1;min-height:280px;position:relative;touch-action:none}
.clegend{position:absolute;top:6px;left:10px;right:76px;z-index:3;display:flex;flex-wrap:wrap;column-gap:8px;pointer-events:none;font:500 11px/1.5 var(--num);color:var(--muted);text-shadow:0 0 4px #000,0 0 2px #000}
.clegend .lg1{flex-basis:100%;font:500 13px/1.5 var(--sans);color:var(--fg)}
.clegend .lg1 b{font-weight:600;color:var(--strong)}
.clegend span{white-space:nowrap}
.clegend em{font-style:normal;color:var(--fg)}
.clegend .up{color:var(--green)} .clegend .dn{color:var(--red)}
.c-live{position:absolute;right:76px;bottom:38px;z-index:3;width:34px;height:34px;display:none;place-items:center;padding:0;border:1px solid var(--l4);border-radius:50%;background:var(--l2);color:var(--fg)}
.c-live.on{display:grid}
.c-live svg{width:18px;height:18px}
.c-err{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:0 28px;text-align:center;font:500 15px/1.45 var(--sans);color:var(--muted)}
/* chart settings sheet */
.cs-lab{margin:18px 0 8px;font:500 13px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sh-title+.cs-lab{margin-top:2px}
.ctypes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ctype{min-width:0;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 2px;border:1px solid var(--l3);border-radius:12px;background:var(--l1);color:var(--fg);font:500 12px/1.2 var(--sans);text-align:center}
.ctype svg{width:24px;height:24px}
.ctype.on{border-color:var(--brand);background:rgba(71,114,245,.14);color:var(--strong)}
.csets{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--l3);border-radius:14px;background:var(--l1)}
.cset{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;border:0;border-top:1px solid var(--l3);background:none;color:var(--fg);font:500 16px var(--sans);text-align:left}
.cset:first-child{border-top:0}
.cset .cl{flex:1;min-width:0}
.cset i{flex:none;width:16px;height:3px;border-radius:2px}
.cset.on{color:var(--strong)}
.cset.on .cb{background:var(--brand-solid);border-color:var(--brand-solid);color:#fff}
.cs-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cs-head .icbtn{flex:none;width:44px;height:44px;margin:-6px -8px 0 0;border:1px solid var(--l3);border-radius:50%}
.cs-head .icbtn svg{width:20px;height:20px}
/* a draggable level under the pointer (desktop) */
.chartbox.c-grab *{cursor:ns-resize!important}
.chartbox.c-tap *{cursor:pointer!important}
/* tap a level: a small menu next to it (close, cancel, remove, edit) */
/* tap on the chart: what to place at that price (as in TradingView) */
.c-tbar{position:absolute;z-index:6;display:none;align-items:center;gap:4px;padding:5px;border:1px solid var(--l4);border-radius:14px;background:rgba(14,14,17,.96);box-shadow:0 10px 28px rgba(0,0,0,.5)}
.c-tbar.on{display:flex}
.c-tbar button{flex:none;height:40px;min-width:48px;padding:0 12px;border:0;border-radius:9px;background:var(--l2);color:var(--strong);font:500 15px var(--sans)}
.c-tbar button:active{background:var(--l3)}
.c-tbar .x{min-width:40px;display:grid;place-items:center;padding:0;background:none;color:var(--fg)}
.c-tbar .x svg{width:20px;height:20px}
@media (max-width:360px){.c-tbar button{min-width:42px;padding:0 9px;font-size:14px}}
.c-pop{position:absolute;z-index:6;display:none;min-width:190px;max-width:calc(100% - 96px);padding:6px;border:1px solid var(--l4);border-radius:14px;background:rgba(23,23,28,.97);box-shadow:0 10px 28px rgba(0,0,0,.55)}
.c-pop.on{display:block}
.c-pop b{display:block;padding:6px 10px 8px;font:500 13px/1.35 var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-pop button{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--strong);font:500 15px var(--sans);text-align:left}
.c-pop button svg{flex:none;width:18px;height:18px;color:var(--muted)}
.c-pop button:active{background:var(--l3)}
.c-pop button.dg,.c-pop button.dg svg{color:var(--red)}
.ctb.on{background:var(--l3);color:var(--strong)}
.c-hint{position:absolute;left:50%;bottom:40px;z-index:4;display:none;align-items:center;gap:10px;max-width:calc(100% - 96px);padding:6px 6px 6px 14px;border:1px solid var(--l4);border-radius:12px;background:rgba(23,23,28,.94);color:var(--strong);font:500 14px/1.3 var(--sans);transform:translateX(-50%);white-space:nowrap}
.c-hint.on{display:flex}
.c-hint span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.c-hint button{flex:none;height:32px;padding:0 12px;border:0;border-radius:8px;background:var(--l3);color:var(--strong);font:500 14px var(--sans)}
.dclr,.dclr svg{color:var(--red)!important}
.ipad{flex:none;padding:2px 16px 16px}
/* order bar under the chart (TradeLocker layout) */
.cot{flex:none;overflow:hidden;border-top:1px solid var(--l3)}   /* no card: controls sit on the page, a hairline parts them from the chart */
.cot-top{display:flex;align-items:center;gap:4px;padding:9px 10px;overflow-x:auto;scrollbar-width:none}
.cot-top::-webkit-scrollbar{display:none}
/* a set level shows its price or its distance in % (as chosen in the SL / TP sheet) */
.c-v{margin-left:4px;font-size:11px}
.c-v:empty{display:none}
/* SL / TP: no cross (a level is cleared in the sheet), so no room is reserved for it */
.cot-b.c-opt.c-leg,.cot-b.c-opt.c-leg.on{padding:0 7px}
.cot-top.tight{gap:3px}
.cot-top.tight .c-v{margin-left:3px;font-size:10px}
.cot-b{flex:none;height:34px;display:inline-flex;align-items:center;justify-content:center;gap:3px;padding:0 7px;border:1px solid transparent;border-radius:8px;background:var(--l2);color:var(--strong);font:500 12px var(--sans);white-space:nowrap}
.cot-b svg{flex:none;width:14px;height:14px}
.cot-b:active{filter:brightness(1.25)}
.c-type{margin-right:auto;border-color:#24398c;background:transparent;transition:background-color .2s,border-color .2s}
/* both labels share one cell, so PENDING and MARKET keep the same button width */
.c-tl{display:grid}
.c-tl i{grid-area:1 / 1;font-style:normal;text-align:center}
.c-tl i+i,.cot.mkt .c-tl i:first-child{visibility:hidden}
.cot.mkt .c-tl i+i{visibility:visible}
.cot.mkt .c-type{border-color:transparent;background:var(--l2)}
/* RISK / SL / TP: grey when off, blue with a cross when on. Room for the cross is always reserved, so the width
   never changes: off, the label sits in the middle; on, it slides left and the cross fades in on the right. */
.cot-b.c-opt{position:relative;padding:0 14px;color:var(--fg);transition:background-color .2s,border-color .2s,padding .2s}
.c-x{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;padding:0 7px 0 3px;opacity:0;pointer-events:none;transition:opacity .2s}
.cot-b.c-opt .c-x svg{width:11px;height:11px}
.cot-b.c-opt.on{padding:0 21px 0 7px;border-color:#2747b5;background:#0e1b52;color:var(--strong)}
.cot-b.c-opt.on .c-x{opacity:1;pointer-events:auto}
.cot-mg{padding:9px 12px 8px;text-align:center;font:400 13px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.cot-mg b{font-weight:500;color:var(--strong)}
/* plain market: Sell | lots | Buy. Pending, or RISK / SL / TP on: Sell narrows to a side switch and the right button is the order */
.cot-row{display:flex;padding:0 12px 10px;container-type:inline-size;--B:clamp(96px, 24cqw, 150px);--T:48px}
.cot-sw{flex:none;width:var(--T);height:48px;margin-right:8px;transition:width .38s cubic-bezier(.2,.8,.2,1)}
.cot.full .cot-sw{width:var(--B)}
.cot-side{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;border:1px solid;border-color:#6b2029;background:#2c0b10;border-radius:12px;color:var(--strong);transition:background-color .25s,border-color .25s}
.cot.ss .cot-side{border-color:#1f5c48;background:#0b2a22}
.cs-ico{display:grid;transition:opacity .2s .1s}
.cs-ico svg{width:20px;height:20px}
.cs-full{position:absolute;top:50%;left:50%;display:flex;flex-direction:column;align-items:center;white-space:nowrap;transform:translate(-50%,-50%);opacity:0;transition:opacity .1s}
.cot.full .cs-full{opacity:1;transition:opacity .2s .14s}
.cot.full .cs-ico{opacity:0;transition:opacity .1s}
.cot-lots{flex:none;width:calc(100cqw - 16px - 2 * var(--B));display:flex;align-items:center;height:48px;border-radius:12px;background:var(--l2);transition:width .38s cubic-bezier(.2,.8,.2,1)}
.cot-lots button{flex:none;width:28px;height:100%;display:grid;place-items:center;padding:0;border:0;background:none;color:var(--fg);transition:width .38s cubic-bezier(.2,.8,.2,1)}
.cot-lots button svg{width:16px;height:16px}
.cot-lots button:active{color:var(--strong)}
.cot-lots span{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0}
.cot-lots input{width:100%;min-width:0;height:22px;padding:0;border:0;background:none;outline:0;text-align:center;font:500 17px/1.2 var(--sans);color:var(--strong);font-variant-numeric:tabular-nums}
.cot-lots:focus-within{box-shadow:inset 0 0 0 1px var(--brand)}
.cot-lots small{font:400 12px/1.2 var(--sans);color:var(--muted);white-space:nowrap}
.cot-go{flex:1;margin-left:8px;height:48px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0 6px;border:1px solid;border-color:#1f5c48;background:#0b2a22;border-radius:12px;color:var(--strong);transition:background-color .25s,border-color .25s}
.cot.ss .cot-go{border-color:#6b2029;background:#2c0b10}
.cot-go b,.cs-full b{font:500 17px/1.2 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.cot-go span,.cs-full span{font:500 12px/1.2 var(--sans);letter-spacing:.03em}
@media (max-width:360px){
  .cot-top{gap:3px;padding:8px}
  .cot-b{height:32px;padding:0 5px;font-size:11px}
  .cot-b svg{width:12px;height:12px}
  .cot-b.c-opt{padding:0 11.5px}
  .cot-b.c-opt.on{padding:0 18px 0 5px}
  .cot-b.c-opt .c-x{padding:0 5px 0 3px}
  .cot-b.c-opt.c-leg,.cot-b.c-opt.c-leg.on{padding:0 5px}
  .c-v{margin-left:3px;font-size:10.5px}
  .cot-b.c-opt .c-x svg{width:10px;height:10px}
  .cot-row{padding:0 10px 8px;--B:clamp(86px, 24cqw, 150px);--T:42px}
  .cot-lots button{width:24px}
  .cot-lots input{font-size:16px}
  .cot.full .cot-go b,.cot.full .cs-full b{font-size:15px}
}
.srow.cur{background:rgba(71,114,245,.09)}

/* order ticket */
.ticket{display:flex;flex-direction:column;gap:18px;padding:16px 16px 0}
/* ticket toggles: order type, then direction — same segmented control, caps labels */
.ticket .seg3 button{font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.ticket .seg3 button.on{box-shadow:inset 0 0 0 1px var(--l4)}
.seg3.dir .d-sell{color:var(--red)} .seg3.dir .d-buy{color:var(--green)}
.seg3.dir .d-sell.on{background:#2C1115;box-shadow:inset 0 0 0 1px #5A2129;color:#FFE1E4}
.seg3.dir .d-buy.on{background:#0D2A22;box-shadow:inset 0 0 0 1px #1B4A3D;color:#DDF8EE}
.fl{display:flex;flex-direction:column;gap:8px}
.lbl{font:500 15px var(--sans);color:var(--muted)}
.lblrow{display:flex;justify-content:space-between;align-items:baseline}
.units{font:500 14px var(--num);color:var(--muted)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;background:var(--l1);border:1px solid var(--l3);border-radius:13px}
.seg3 button{height:44px;border:0;border-radius:10px;background:none;color:var(--muted);font:600 16px var(--sans)}
.seg3 button.on{background:var(--l3);color:var(--strong)}
.stepper{display:flex;align-items:center;height:56px;background:var(--l1);border:1px solid var(--l3);border-radius:13px}
.stp{flex:none;width:56px;height:100%;display:grid;place-items:center;border:0;background:none;color:var(--strong);padding:0}
.stp svg{width:22px;height:22px}
.stp:active{background:var(--l2)}
.num{flex:1;min-width:0;text-align:center;background:none;border:0;outline:0;color:var(--strong);font:600 19px var(--num)}
.qrow{display:flex;gap:6px}
.q{flex:1;height:40px;border-radius:10px;border:1px solid var(--l3);background:none;color:var(--fg);font:500 15px var(--num)}
.q.on{border-color:#fff;color:#fff}
.seg3.two{grid-template-columns:1fr 1fr}
.hint{font:500 14px var(--sans);color:var(--muted)}
.stepper.dis{opacity:.45}
.stepper.dis .num{-webkit-text-fill-color:currentColor;opacity:1}
/* input box with a clear button and a unit switch inside: ticket Risk ($ / %), SL / TP sheet (Price / %) */
.fieldbox{display:flex;align-items:center;gap:2px;height:56px;padding-right:5px;background:var(--l1);border:1px solid var(--l3);border-radius:13px}
.fieldbox:focus-within{border-color:var(--brand)}
.fieldbox input{flex:1;min-width:0;height:100%;padding:0 4px 0 16px;background:none;border:0;outline:0;color:var(--strong);font:600 19px var(--num)}
.fieldbox input::placeholder{font:500 16px var(--sans);color:var(--muted)}
.fieldbox input[data-tkrisk]::placeholder{font:600 19px var(--num)}   /* the computed max risk reads as a number, greyed */
.slrow .fieldbox{background:var(--l2)}     /* a step lighter than its card, as the ticket box is against the page */
/* SL / TP checkbox chips in the ticket; tapping one opens the SL/TP sheet */
.legs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.legchip{display:flex;align-items:center;gap:8px;min-width:0;height:50px;padding:0 12px;border:1px solid var(--l3);border-radius:13px;background:var(--l1);text-align:left}
.legchip.on{background:#0A1B4B;border-color:#123482}
.legchip .lt{flex:none;font:600 16px var(--sans);color:var(--strong)}
.legchip .val{flex:1;min-width:0;text-align:right;font:500 15px var(--num);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legchip .val.off{font:400 14px var(--sans);color:var(--muted)}
.cb{flex:none;width:24px;height:24px;display:grid;place-items:center;border:1.5px solid var(--l4);border-radius:6px;color:transparent}
.cb svg{width:16px;height:16px}
.legchip.on .cb{background:var(--brand-solid);border-color:var(--brand-solid);color:#fff}
/* SL / TP sheet: one row per leg — input, Price/% switch, reset */
.sh-title{margin-bottom:16px}
.sh-title b{display:block;font:600 20px var(--sans);color:var(--strong)}
.sh-title span{font:400 14px var(--sans);color:var(--muted)}
.slrows{display:flex;flex-direction:column;gap:10px}
.slrow{padding:12px 12px 10px;border:1px solid var(--l3);border-radius:14px;background:var(--l1)}
.slrow.sl{--dotc:var(--red)} .slrow.tp{--dotc:var(--green)}
.slr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.slr-top b{display:flex;align-items:center;gap:8px;font:600 16px var(--sans);color:var(--strong)}
.slr-top b::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--dotc)}
.slr-pl{font:500 14px var(--num)}
/* hint line with Clean on the right: a plain text link, no fill or border */
.slr-foot{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px}
.slr-clr{flex:none;margin:-8px 0;padding:8px 0 8px 8px;border:0;background:none;color:var(--brand);font:500 13px var(--sans)}
.slr-clr:active{opacity:.6}
.slr-clr[hidden]{display:none}
.slr-pl .mr{margin-right:6px;font:500 13px var(--sans);color:var(--muted)}
.unit{flex:none;display:flex;gap:2px}
.unit button{height:44px;min-width:40px;padding:0 9px;border:0;border-radius:10px;background:none;color:var(--muted);font:600 15px var(--sans)}
.unit button.on{background:var(--l3);color:var(--strong)}
.slclr{flex:none;width:40px;height:40px;display:grid;place-items:center;padding:0;border:0;background:none;color:var(--muted)}
.slclr svg{width:18px;height:18px}
.slclr:active{color:var(--strong)}
.slclr[hidden]{display:none}
.slr-hint{font:400 13px var(--sans);color:var(--muted)}
.slr-hint.warn{color:#F5B83D}
.sl-done{margin-top:16px;background:var(--l3);border-color:var(--l3)}   /* quiet gray: closing, not a trade action */
.sl-done:active{background:var(--l4);border-color:var(--l4)}
@media (max-width:360px){.slr-top b{white-space:nowrap} .slr-pl{font-size:12px} .fieldbox input{padding-left:12px;font-size:17px} .slclr{width:34px} .unit{gap:0} .unit button{min-width:32px;padding:0 6px}}
.est{font:500 14px var(--num)}
.sum{background:var(--l1);border:1px solid var(--l3);border-radius:14px;padding:2px 14px}
.sum div{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font:400 15px var(--sans);color:var(--muted)}
.sum div+div{border-top:1px solid var(--l3)}
.sum b{font:600 15px var(--num);color:var(--strong)}
.place-wrap{position:sticky;bottom:0;margin:0 -16px;padding:10px 16px 16px;background:linear-gradient(rgba(0,0,0,0),#000 30%)}
.place{width:100%;height:62px;border:0;border-radius:15px;color:#fff;font:600 18px var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.place small{font:500 14px var(--num);opacity:.9}
.place.buy{background:var(--green-solid)} .place.sell{background:var(--red-solid)}
.place:active{filter:brightness(.9)}

/* scanner tab: verdict, signals, indicators and a Bollinger-band chart, sized to fit one screen */
#pScan{display:flex;flex-direction:column}
.scan{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:14px 16px}
.sc-top{display:flex;align-items:center;gap:8px}
.sc-top b{margin-right:auto;font:700 18px var(--sans);color:var(--strong);white-space:nowrap}
.vpill{padding:5px 10px;border-radius:8px;background:var(--l3);color:var(--fg);font:600 14px var(--sans);white-space:nowrap}
.vpill.pos{background:var(--green-bg);color:var(--green)} .vpill.neg{background:var(--red-bg);color:var(--red)}
.rule{height:30px;padding:0 10px;border:1px solid var(--l4);border-radius:8px;background:none;color:var(--fg);font:500 14px var(--sans)}
.sc-meta{margin-top:-6px;font:400 14px var(--sans);color:var(--muted)}
.sc-meta .ago{color:var(--brand)}
.sc-sum{margin:0;font:400 16px/1.45 var(--sans);color:var(--fg)}
.sc-sig{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sg{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-radius:10px;background:var(--l2);color:var(--fg);font:500 14px var(--sans);white-space:nowrap;overflow:hidden}
.sg svg{flex:none;width:11px;height:11px}
.sg.pos svg{color:var(--green)} .sg.neg svg{color:var(--red)}
.sg.net{justify-content:center;font-weight:600}
.sg.net.pos{background:var(--green-bg);color:var(--green)} .sg.net.neg{background:var(--red-bg);color:var(--red)} .sg.net.neu{background:var(--l3);color:var(--strong)}
.sc-ind{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sc-ind .stat{padding:8px 10px}
.sc-ind em{display:block;margin-top:1px;font:normal 400 12px var(--sans);color:var(--muted)}
.sc-chart{flex:1;min-height:170px;position:relative;overflow:hidden;border:1px solid var(--l3);border-radius:14px;background:var(--l1)}
.sc-chart canvas{position:absolute;inset:0;width:100%;height:100%}

/* scanner screen: slides up from the bottom like the instrument screen */
.scr{position:absolute;top:var(--st);left:0;right:0;bottom:0;z-index:14;display:flex;flex-direction:column;background:var(--bg);
  transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.scr-open #scr,.ins-open #ins,.trd-open #trd{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.scr-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 8px 16px}
.scr-head b{display:block;font:700 26px var(--sans);letter-spacing:-.01em;color:var(--strong)}
.scr-head span{font:400 14px var(--sans);color:var(--muted)}
.scr-head .sclose{width:44px;height:44px}
.scr-head .sclose svg{width:24px;height:24px}
.scr-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:var(--hb);scrollbar-width:none}
.scr-body::-webkit-scrollbar{display:none}
.scr-cards{display:flex;flex-direction:column;gap:12px;padding:14px 16px 20px}
.scr-list{padding:6px 0 20px}
.note{display:flex;gap:12px;padding:16px;border-radius:16px;background:var(--l2)}
.note>svg{flex:none;width:22px;height:22px;margin-top:1px;color:var(--fg)}
.note b{display:block;margin-bottom:4px;font:500 17px var(--sans);color:var(--strong)}
.note p{margin:0;font:400 15px/1.45 var(--sans);color:var(--fg)}
.mc{position:relative;display:block;width:100%;padding:16px 16px 18px;border:1px solid var(--l3);border-radius:16px;background:var(--l1);text-align:left}
button.mc:active{background:var(--l2)}
.mc h4{display:flex;align-items:center;gap:8px;margin:0 0 6px;font:500 17px var(--sans);color:var(--fg)}
.mc h4 svg{width:18px;height:18px;color:var(--muted)}
.mc .v{font:600 28px var(--sans);letter-spacing:-.01em;color:var(--strong)}
.mc .v.up{color:var(--green)} .mc .v.dn{color:var(--red)}
.mc .v em{margin-left:10px;font:normal 600 20px var(--num)}
.mc .s{margin-top:6px;font:400 15px var(--sans);color:var(--muted)}
.mc .mc-go{position:absolute;top:16px;right:14px;width:22px;height:22px;color:var(--muted)}
.bias{display:flex;gap:3px;height:6px;margin:12px 0 10px;border-radius:3px;overflow:hidden}
.bias i{display:block} .bias .b-up{background:var(--green)} .bias .b-mid{background:var(--l4)} .bias .b-dn{background:var(--red)}

/* insights screen (same slide-up shell as the scanner) */
.ins-acc{flex:none;display:flex;align-items:center;gap:6px;padding:2px 16px 12px}
.acc-card{display:flex;align-items:stretch;min-width:0;height:52px;overflow:hidden;border:1px solid var(--l3);border-radius:12px;background:var(--l1)}
.acc-card .demo{border-radius:0}
.acc-card .logo{width:50px;border:0;border-radius:0}
.acc-t{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:0 14px 0 12px}
.acc-t b{font:500 16px var(--sans);color:var(--strong);white-space:nowrap}
.acc-t span{font:400 13px var(--num);color:var(--muted);white-space:nowrap}
.ins-acc .info{width:40px;height:40px;color:var(--muted)}
.ins-acc .info svg{width:22px;height:22px}
.sqbtn{flex:none;margin-left:auto;width:52px;height:52px;display:grid;place-items:center;padding:0;border:1px solid var(--l3);border-radius:12px;background:none;color:var(--strong)}
.sqbtn svg{width:24px;height:24px}
.sqbtn{position:relative}
.sqbtn.has::after{content:'';position:absolute;top:9px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px var(--bg)}
/* insights filters sheet */
.flab{margin:18px 0 10px;font:600 15px var(--sans);color:var(--strong)}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--l3);border-radius:10px;background:var(--l1);color:var(--fg);font:500 15px var(--sans)}
.fchip.on{border-color:#fff;background:#fff;color:#000}
.fchip .ic{width:22px;height:22px;font-size:11px}
.fchip .ic.sm{font-size:8px}
.fchip em{font:normal 500 13px var(--num);opacity:.6}
.fdates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fdates label{display:flex;flex-direction:column;gap:6px;font:500 13px var(--sans);color:var(--muted)}
.fdates input{min-width:0;height:48px;padding:0 10px;border:1px solid var(--l3);border-radius:12px;background:var(--l1);color:var(--strong);font:500 15px var(--num);color-scheme:dark;outline:0}
.fdates input:focus{border-color:var(--brand)}
.fbtns{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:22px}
/* habits: found in your trades */
.hb-h{margin:4px 2px 0;font:500 18px var(--sans);color:var(--fg)}
.hcard{border:1px solid var(--l3);border-radius:16px;background:var(--l1)}
.hcard.open{border-color:#fff}
.hc-top{display:flex;align-items:center;gap:12px;padding:16px 14px 16px 16px;cursor:pointer}
.hc-t{flex:1;min-width:0}
.hc-t b{margin-right:8px;font:600 19px var(--sans);color:var(--strong)}
.hc-st{font:500 14px var(--sans);color:var(--fg);white-space:nowrap}
.hc-st.good{color:var(--green)} .hc-st.bad{color:var(--red)}
.hc-t small{display:block;margin-top:6px;font:400 16px var(--sans);color:var(--muted)}
.hc-v{flex:none;font:500 20px var(--num)}
.hc-top>svg{flex:none;width:22px;height:22px;color:var(--fg);transition:transform .2s}
.hcard.open .hc-top>svg{transform:rotate(180deg)}
.hdet{padding:16px;border:1px solid var(--l3);border-radius:16px;background:var(--l1)}
.hseg{display:inline-grid;grid-template-columns:repeat(3,auto);margin-bottom:16px;background:var(--l2)}
.hseg button{padding:0 14px}
.hd-t{margin:0 0 12px;font:600 21px/1.3 var(--sans);color:var(--strong)}
.hd-p{margin:0 0 16px;font:400 17px/1.5 var(--sans);color:var(--fg)}
.sugg{padding:14px 16px;border:1.5px solid #0f4c78;border-radius:12px;background:#03182a}
.sugg span{display:block;font:400 15px var(--sans);color:var(--muted)}
.sugg b{display:block;margin-top:4px;font:500 17px/1.4 var(--sans);color:#4C9BF5}
.hd-foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--l3);font:400 15px var(--sans);color:var(--muted)}
.conf{padding:4px 10px;border-radius:6px;background:var(--l2);color:var(--strong);font:500 15px var(--sans)}
.hd-see{display:flex;align-items:center;gap:10px;height:46px;margin:14px 0 0 auto;padding:0 14px 0 18px;border:1px solid var(--l4);border-radius:10px;background:none;color:var(--strong);font:500 16px var(--sans)}
.hd-see svg{width:18px;height:18px}
.hchart{display:block;width:100%;height:170px}
.hd-cap{margin:6px 0 0;font:400 14px var(--sans);color:var(--muted)}
.hlist{margin:0 -16px -16px}
.ins-tabs .tab{display:flex;align-items:center;gap:10px;height:54px;padding:0 14px}
.ins-tabs .tab svg{width:22px;height:22px}
.ins-tabs .tab-ind{transition:transform .3s cubic-bezier(.2,.8,.2,1),width .3s cubic-bezier(.2,.8,.2,1)}
.ib{display:grid;place-items:center;width:28px;height:28px;margin:-6px 0;padding:0;border:0;background:none;color:var(--muted)}
.spark2{display:block;width:100%;height:56px;margin:14px 0 4px}
.cmp{display:flex;flex-direction:column;gap:8px;margin:12px 0 8px}
.cmp div{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;font:500 13px var(--sans);color:var(--muted)}
.cmp i{display:block;height:6px;border-radius:3px}
.cmp .c-up{background:var(--green)} .cmp .c-dn{background:var(--red)}
.nw{white-space:nowrap}
.lsum{display:flex;justify-content:space-between;padding:14px 16px 4px;font:500 14px var(--sans);color:var(--muted)}
.sd-buy{color:var(--green)} .sd-sell{color:var(--red)}

/* trades screen (layout follows the TradeLocker Trades page) */
.hd-ins{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 12px;border:0;border-radius:999px;background:var(--brand-solid);color:#fff;font:600 16px var(--sans);box-shadow:0 0 0 1px rgba(71,114,245,.45),0 6px 18px rgba(25,91,225,.35)}
.hd-ins svg{width:22px;height:22px}
.hd-ins{flex:none;white-space:nowrap}
@media (max-width:350px){.hd-ins svg{display:none} .hd-ins{padding:0 14px}}
.scr-head .hd-ins span{font:600 16px var(--sans);color:#fff}
.pc-line{grid-column:1 / 3;max-height:24px;margin-top:-2px;font:500 15px var(--num);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:max-height .3s cubic-bezier(.2,.8,.2,1),margin .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.pc-open .pc-line{max-height:0;margin-top:-10px;opacity:0}
.hd-ins:active{filter:brightness(.9)}
.badge[hidden],.cnt[hidden],.closeall[hidden]{display:none}
.tiles{flex:none;display:flex;gap:6px;padding:2px 16px 12px}
.tile{flex:1 1 auto;min-width:0;padding:10px 9px;border-radius:12px;background:var(--l2)}
.tile span{display:block;font:400 12px/1.25 var(--sans);color:var(--muted)}
.tile b{display:block;margin-top:4px;font:500 15px var(--num);color:var(--strong);white-space:nowrap}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:#fff;color:#000;font:normal 600 14px var(--sans)}
.cnt.z{background:var(--l3);color:var(--fg)}
.pcard{overflow:hidden;border:1px solid var(--l3);border-radius:16px;background:var(--l1)}
.pc-h{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;align-items:center;gap:10px;padding:14px 10px 14px 14px;cursor:pointer}
.pc-sym{display:flex;align-items:center;gap:10px;min-width:0;font:600 18px var(--sans);color:var(--strong)}
.pc-sym .ic{width:26px;height:26px;font-size:12px}
.pc-sym .ic.sm{font-size:9px}
.plp{justify-self:end;padding:4px 8px;border-radius:6px;font:500 16px var(--num)}
.plp[data-s="up"]{background:var(--green-bg);color:var(--green)} .plp[data-s="dn"]{background:var(--red-bg);color:var(--red)}
.kind{justify-self:end;padding:4px 10px;border-radius:6px;background:#0A1B4B;color:var(--strong);font:600 15px var(--sans);text-transform:uppercase}
.pc-chev{grid-row:1 / 3;grid-column:3;width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;border-radius:10px;background:none;color:var(--fg)}
.pc-chev svg{width:22px;height:22px;transition:transform .2s}
.pc-open .pc-chev{background:var(--l2)}
.pc-open .pc-chev svg{transform:rotate(180deg)}
.pc-sub{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;font:500 17px var(--num);color:var(--strong);white-space:nowrap}
.pc-sub em{font:normal 400 16px var(--sans);color:var(--muted)}
.sp-buy,.sp-sell{padding:3px 8px;border-radius:5px;font:600 13px var(--sans);text-transform:uppercase}
.sp-buy{background:#0b3b2e;color:var(--green)} .sp-sell{background:#3d1013;color:var(--red)}
.legp{justify-self:end;display:flex;gap:6px}
.legp i{padding:2px 7px;border-radius:5px;font:normal 600 12px var(--sans)}
.legp .l-sl{background:#240c10;color:#8f3a45} .legp .l-tp{background:#07241d;color:#2a7f67}
.legp .l-sl.set{background:#4a141b;color:var(--red)} .legp .l-tp.set{background:#0b3d31;color:var(--green)}
.pc-body{display:grid;grid-template-rows:0fr;padding:0 14px;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1)}
.pc-open .pc-body{grid-template-rows:1fr}
.pc-in{min-height:0;overflow:hidden;opacity:0;transition:opacity .18s}
.pc-open .pc-in{opacity:1;transition:opacity .25s .08s}
.pc-px{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:14px 0;border-top:1px solid var(--l3)}
.pc-px .lab{display:block;margin-bottom:6px;font:400 15px var(--sans);color:var(--muted)}
.pc-px b{display:block;font:500 19px var(--num);color:var(--strong);white-space:nowrap}
.pc-px .r b{display:flex;flex-wrap:wrap;justify-content:flex-end;column-gap:6px}
.pc-px small{display:block;margin-top:4px;font:400 13px var(--sans);color:var(--muted)}
.pc-px .r{text-align:right}
.pc-px .arr{width:22px;height:22px;margin:0 8px;color:var(--muted)}
.dpts{font:500 16px var(--num)}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:14px 0;border-top:1px solid var(--l3)}
.pc-grid div>span,.pc-grid .cellbtn>span{display:block;margin-bottom:4px;font:500 13px var(--sans);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.pc-grid b{font:500 16px var(--num);color:var(--strong)}
.pc-grid .wide{grid-column:1 / -1}
.cellbtn{display:block;width:calc(100% + 16px);margin:-6px -8px;padding:6px 8px;border:0;border-radius:8px;background:none;color:inherit;text-align:left}
.cellbtn:active{background:var(--l2)}
.cellbtn b svg{width:15px;height:15px;margin-left:8px;vertical-align:-2px;color:var(--muted)}
.legp i[data-a]{cursor:pointer}
.pc-kind{justify-self:end;font:400 16px var(--sans);color:var(--fg)}
.pc-grid b.up{color:var(--green)} .pc-grid b.dn{color:var(--red)}
.pc-grid b.id{font-size:13px;overflow-wrap:anywhere}   /* 18-digit IDs side by side on a 375px phone */
.pc-share{display:flex;justify-content:center;padding:8px 0 10px;border-top:1px solid var(--l3)}
.pc-share button{width:48px;height:44px;display:grid;place-items:center;padding:0;border:0;background:none;color:var(--strong)}
.pc-share svg{width:26px;height:26px}
.pc-act{display:flex;border-top:1px solid var(--l3)}
.pc-act button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 2px;border:0;background:none;color:var(--strong);font:500 13px var(--sans);white-space:nowrap}
.pc-act svg{width:24px;height:24px}
.pc-act button:active{background:var(--l2)}
.closeall{position:absolute;left:50%;bottom:calc(16px + var(--hb));z-index:2;transform:translateX(-50%);display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 18px 0 22px;border:1px solid var(--l3);border-radius:12px;background:var(--l2);color:var(--strong);font:500 18px var(--sans);box-shadow:0 8px 24px rgba(0,0,0,.6)}
.closeall svg{width:24px;height:24px}
#trdBody.pad{padding-bottom:calc(90px + var(--hb))}

/* market scanner (content follows the TradeLocker screen) */
.ms-ctl{flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 12px}
.ms-ctl .seg3{flex:1}
.ms-ctl .sqbtn{margin:0;width:50px;height:50px}
.ms-ctl .sqbtn.on{color:#F2B53A}
.ms-pills{flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 12px}
.pill2{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 18px;border:0;border-radius:999px;background:#0f1738;color:#7D9BFA;font:500 17px var(--sans);white-space:nowrap}
.pill2 svg{width:18px;height:18px}
.cd{position:relative;flex:none;width:48px;height:48px;display:grid;place-items:center;padding:0;border:0;background:none;color:var(--strong);font:500 12px var(--num)}
.cd .ring2{position:absolute;inset:0;transform:rotate(-90deg)}
.cd .pz{position:absolute;right:-5px;bottom:-3px;width:20px;height:20px;display:grid;place-items:center;border-radius:6px;background:var(--l3);color:var(--fg)}
.cd .pz svg{width:12px;height:12px}
.msc{overflow:hidden;border:1px solid var(--l3);border-radius:20px;background:radial-gradient(120% 90% at 100% 0%,rgba(98,80,220,.16),transparent 60%),var(--l1)}
.msc-in{padding:18px 18px 20px}
.msc h3{display:flex;align-items:center;justify-content:space-between;margin:0;font:600 20px var(--sans);color:var(--strong)}
.ai{display:inline-grid;place-items:center;height:30px;padding:0 7px;border:1.5px solid var(--fg);border-radius:6px;font:600 14px var(--sans);color:var(--fg)}
.msc .snap{margin-top:6px;font:400 16px/1.4 var(--sans);color:var(--muted)}
.msc .txt{margin:18px 0 0;font:400 17px/1.5 var(--sans);color:var(--fg)}
.msr{display:flex;align-items:center;gap:14px;padding:16px 18px;border-top:1px solid var(--l3)}
.msr>svg{flex:none;width:26px;height:26px}
.msr b{flex:1;font:600 18px var(--sans);color:var(--strong)}
.msr button{flex:none;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 12px 0 16px;border:1px solid var(--l4);border-radius:10px;background:none;color:var(--strong);font:500 16px var(--sans)}
.msr button svg{width:18px;height:18px}
.gauge{display:block;width:100%;max-width:300px;margin:6px auto 0}
.ms-h{margin:12px 2px 0;font:600 24px var(--sans);color:var(--strong)}
.ms-tools{display:flex;gap:8px}
.ms-search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border:1px solid var(--l3);border-radius:12px;background:var(--l1);color:var(--muted)}
.ms-search svg{flex:none;width:20px;height:20px}
.ms-search input{flex:1;min-width:0;width:100%;border:0;outline:0;background:none;color:var(--strong);font:400 17px var(--sans)}
.ms-sort{flex:none;display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 10px 0 12px;border:0;border-radius:12px;background:var(--l2);color:var(--fg);font:500 15px var(--sans);white-space:nowrap}
.ms-sort svg{width:18px;height:18px}
.ms-sq{flex:none;width:44px;height:48px;display:grid;place-items:center;padding:0;border:0;border-radius:12px;background:var(--l2);color:var(--fg)}
.ms-sq svg{width:12px;height:12px;transition:transform .2s}
.ms-sq.asc svg{transform:rotate(180deg)}
.ms-list{margin:0}
.mst{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;column-gap:9px;row-gap:8px}
.mst-h,.mst-r{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;padding:0 4px 0 14px}
.mst-h{padding-bottom:2px;font:400 13px var(--sans);color:var(--muted)}
.mst-h span{text-align:right}
.mst-h span:first-child{text-align:left}
.mst-r{height:60px;border-radius:14px;background:var(--l2);font:400 15px var(--sans);color:var(--strong);font-variant-numeric:tabular-nums;cursor:pointer}
.mst-r:active{background:var(--l3)}
.mst-r b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 15px var(--sans)}
.mst-r .p,.mst-r .c,.mst-r .t{text-align:right;white-space:nowrap}
.mst-r .c::before{content:'';display:inline-block;margin:0 6px 2px 0;border:4px solid transparent;vertical-align:middle}
.mst-r .c.up::before{border-bottom:5px solid currentColor;border-top-width:0}
.mst-r .c.dn::before{border-top:5px solid currentColor;border-bottom-width:0}
.mst-r .t{color:var(--muted)}
.mst-r .t.up{color:var(--green)} .mst-r .t.dn{color:var(--red)}
.mst-fav{width:30px;height:40px;display:grid;place-items:center;margin-left:-4px;padding:0;border:0;background:none;color:var(--muted)}
.mst-fav svg{width:20px;height:20px}
.mst-fav.on{color:var(--brand)}
@media (max-width:360px){.mst{column-gap:6px} .mst-h,.mst-r{padding:0 2px 0 12px} .mst-h{font-size:12px} .mst-r,.mst-r b{font-size:13px} .mst-fav{width:26px} .mst-fav svg{width:18px;height:18px} .mst-r .c::before{margin-right:4px}}
.opts{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:10px;height:56px;padding:0 4px;border:0;border-bottom:1px solid var(--l3);background:none;color:var(--fg);font:500 17px var(--sans);text-align:left}
.opt span{flex:1}
.opt em{font:normal 500 14px var(--num);color:var(--muted)}
.opt svg{width:20px;height:20px;color:var(--brand)}
.opt.on{color:var(--strong)}

/* margin level dialog (opens from the ring in the header) */
.dlg{position:absolute;left:0;right:0;bottom:0;z-index:33;display:flex;flex-direction:column;max-height:92%;padding-bottom:var(--hb);border:1px solid var(--l3);border-bottom:0;border-radius:26px 26px 0 0;background:var(--l2);
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.dlg::before{content:'';flex:none;width:42px;height:5px;margin:10px auto 0;border-radius:3px;background:var(--l4)}
.dlg-open .dlg{transform:none}
.dlg-open .backdrop{opacity:1;pointer-events:auto}
.dlg-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 8px 4px 20px}
.dlg-head b{font:600 21px var(--sans);color:var(--strong)}
.dlg-body{overflow-y:auto;padding:14px 20px 16px;scrollbar-width:none}
.ml-lead{margin:0 0 20px;font:400 17px/1.45 var(--sans);color:var(--fg)}
.ml-lead b{font-weight:600;color:var(--strong)}
.ml-scale{--x:0%}
.ml-val{width:max-content;margin-left:min(var(--x),calc(100% - 64px));font:500 14px var(--num);color:var(--strong)}
.ml-bar{position:relative;display:flex;gap:8px;height:10px;margin:6px 0}
.ml-ok{flex:100;border-radius:3px;background:var(--l3)}
.ml-bad{flex:44;border-radius:3px;background:#5c1018}
.ml-mark{position:absolute;top:-4px;left:var(--x);width:4px;height:18px;border-radius:2px;background:#fff}
.ml-ticks{position:relative;height:18px;font:500 13px var(--sans);color:var(--muted)}
.ml-ticks span{position:absolute;top:0}
.ml-ticks .mt1{left:calc(100% * 100 / 144 - 8px);transform:translateX(-100%)}
.ml-ticks .mt2{right:0}
.ml-card{margin-top:14px;padding:16px;border-radius:14px;background:#1f1f25}
.ml-ct{display:flex;justify-content:space-between;margin-bottom:10px;font:600 18px var(--sans);color:var(--strong)}
.ml-card p{margin:0 0 10px;font:400 15px/1.45 var(--sans);color:var(--muted)}
.ml-card p:last-child{margin:0}
.ml-card p b{font-weight:500;color:var(--strong)}
.ml-foot{margin:16px 6px 0;text-align:center;font:400 13px/1.45 var(--sans);color:var(--fg)}
.dlg-foot{flex:none;padding:14px 20px 18px;border-top:1px solid var(--l3)}
.dlg-foot .btn{border-color:var(--l3);background:var(--l3)}

/* "More" menu: full-height sheet (layout like the TradingView menu, content from TradeLocker) */
.menu{position:absolute;top:calc(var(--st) + 8px);left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;border:1px solid var(--l3);border-bottom:0;border-radius:26px 26px 0 0;background:var(--l2);
  transform:translateY(105%);pointer-events:none;box-shadow:0 0 0 100vmax rgba(0,0,0,0);transition:transform .34s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.menu-open .menu{transform:none;pointer-events:auto;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
.mn-head{flex:none;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:12px 14px 8px}
.mn-head b{text-align:center;font:600 20px var(--sans);color:var(--strong)}
.mn-head .icbtn{border:1px solid var(--l3);border-radius:50%}
.mn-head .sclose{justify-self:end;width:48px;height:48px}
.mn-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:8px 16px calc(24px + var(--hb));scrollbar-width:none}
.mn-body::-webkit-scrollbar{display:none}
.mn-body>*{flex-shrink:0}
.pro{padding:18px;border:1px solid #8a7a4f;border-radius:18px;background:linear-gradient(135deg,#3a3326 0%,#16151a 78%)}
.pro small{display:block;font:500 13px var(--sans);letter-spacing:.06em;color:#c9b27a}
.pro b{display:block;margin:4px 0 10px;font:700 20px/1.3 var(--sans);color:var(--strong)}
.pro ul{margin:0 0 14px;padding-left:18px;font:400 15px/1.6 var(--sans);color:var(--fg)}
.pro button{height:44px;padding:0 22px;border:0;border-radius:10px;background:#b8a573;color:#111;font:600 16px var(--sans)}
.prof{overflow:hidden;border-radius:18px;background:var(--l3)}
.prof-top{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;background:none;color:inherit;text-align:left}
.avatar{flex:none;width:54px;height:54px;display:grid;place-items:center;border-radius:14px;background:#6e5050;color:#fff;font:600 21px var(--sans)}
.prof-t{flex:1;min-width:0}
.prof-t b{display:block;font:600 19px var(--sans);color:var(--strong)}
.plan{display:inline-block;margin-top:6px;padding:2px 8px;border:1.5px dashed var(--l4);border-radius:6px;font:600 13px var(--sans);letter-spacing:.04em;color:var(--muted)}
.prof-top>svg{flex:none;width:22px;height:22px;color:var(--muted)}
.prof .pro{margin:0 12px 12px}
.mlist{display:flex;flex-direction:column}
.mlist+.mlist{margin-top:14px}
.mrow{display:flex;align-items:center;gap:16px;min-height:56px;padding:0 4px;border:0;border-bottom:1px solid var(--l3);background:none;color:var(--strong);font:400 18px var(--sans);text-align:left}
.mrow svg{flex:none;width:26px;height:26px;color:var(--fg)}
.mrow em{margin-left:auto;font:normal 400 15px var(--sans);color:var(--muted)}
.mrow.out{color:var(--red)}
.mrow.out svg{color:var(--red)}

/* closed trade insight sheet (journal: feelings + note) */
.jbtn{flex:none;width:40px;height:40px;display:grid;place-items:center;margin-right:-4px;padding:0;border:1px solid var(--l3);border-radius:10px;background:var(--l1);color:var(--muted)}
.jbtn svg{width:20px;height:20px}
.jbtn.on{border-color:#5a4b1c;background:#221d0c;color:#E2BE3A}
.ct-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ct-sym{display:flex;align-items:center;gap:10px;font:600 20px var(--sans);color:var(--strong)}
.ct-sym .ic{width:28px;height:28px;font-size:13px}
.ct-sym .ic.sm{font-size:10px}
.ct-meta{font:400 15px/1.55 var(--sans);color:var(--muted)}
.ct-meta .sd-buy,.ct-meta .sd-sell{font-weight:600}
.ct-pl{margin:14px 0 4px;font:600 40px var(--num);letter-spacing:-.02em}
.ct-fees{font:400 14px/1.5 var(--sans);color:var(--muted)}
.ct-exp{display:flex;align-items:center;gap:8px;margin:18px 0 0;padding:6px 0;border:0;background:none;color:var(--fg);font:500 14px var(--sans);letter-spacing:.04em;text-transform:uppercase}
.ct-exp svg{width:18px;height:18px;transition:transform .2s}
.ct-exp.open svg{transform:rotate(90deg)}
.ct-det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}
.ct-det.open{grid-template-rows:1fr}
.ct-det>div{min-height:0;overflow:hidden}
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:12px 0 4px}
.ct-grid span{display:block;margin-bottom:3px;font:500 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ct-grid b{font:500 16px var(--num);color:var(--strong)}
.ct-grid .wide{grid-column:1 / -1}
.ct-lab{margin:22px 0 10px;font:500 14px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ct-tags{display:flex;flex-wrap:wrap;gap:8px}
.feel{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--l3);border-radius:10px;background:var(--l1);color:var(--fg);font:500 15px var(--sans)}
.feel::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c)}
.feel.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--strong)}
.ct-note{display:block;width:100%;min-height:96px;padding:12px 14px;border:1px solid var(--l3);border-radius:12px;background:var(--l1);color:var(--strong);font:400 16px/1.45 var(--sans);resize:vertical;outline:0}
.ct-note::placeholder{color:var(--muted)}
.ct-note:focus{border-color:var(--brand)}
.ct-foot{margin:16px -16px 0;padding:14px 16px 0;border-top:1px solid var(--l3);font:400 14px var(--sans);color:var(--muted)}

/* search: full-height sheet over a dimmed screen */
.search{position:absolute;top:calc(var(--st) + 8px);left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;background:var(--l2);border:1px solid var(--l3);border-bottom:0;border-radius:26px 26px 0 0;
  transform:translateY(105%);pointer-events:none;box-shadow:0 0 0 100vmax rgba(0,0,0,0);transition:transform .34s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.search-open .search{transform:none;pointer-events:auto;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
.sbar{flex:none;display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sfield{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;background:var(--l3);border-radius:999px;color:var(--fg)}
#sIcon{display:grid}
.sfield svg{width:24px;height:24px;flex:none}
.sfield input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--strong);font:400 18px var(--sans);caret-color:var(--brand)}
.sfield input::placeholder{color:var(--muted)}
.sfield input::-webkit-search-cancel-button{-webkit-appearance:none}
.sclose{flex:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--l4);background:transparent;color:var(--strong);display:grid;place-items:center;padding:0}
.sclose svg{width:26px;height:26px}
.sclose:active{background:var(--l3)}
.stabs{flex:none;display:flex;gap:4px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stab{flex:none;height:46px;padding:0 16px;border:0;border-radius:13px;background:none;color:var(--muted);font:600 18px var(--sans);white-space:nowrap}
.stab.on{background:var(--l3);color:var(--strong)}
.sres{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:var(--hb)}
.sres::-webkit-scrollbar{display:none}
.srow{display:flex;align-items:center;gap:12px;min-height:78px;padding:10px 6px 10px 16px;position:relative;cursor:pointer}
.srow:active{background:var(--l3)}
.srow + .srow::before{content:'';position:absolute;top:0;left:70px;right:0;height:1px;background:var(--l3)}
.srow .sym{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .desc{font-size:15px}
.cat{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.cat b{font:600 16px var(--sans);color:var(--strong)}
.cat span{font:400 15px var(--sans);color:var(--muted)}
.add{flex:none;width:48px;height:48px;display:grid;place-items:center;background:none;border:0;border-radius:12px;color:var(--strong);padding:0}
.add svg{width:28px;height:28px}
.add.on{color:var(--brand)}
.pick{flex:none;width:48px;height:48px;display:grid;place-items:center;color:var(--brand)}
.pick svg{width:26px;height:26px}
.add:active{background:var(--l4)}
.none{padding:40px 24px;text-align:center;font:400 17px var(--sans);color:var(--muted)}

/* toast */
.toast{position:absolute;left:50%;bottom:calc(98px + var(--hb));z-index:40;transform:translate(-50%,12px);opacity:0;pointer-events:none;width:max-content;max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:#fff;color:#000;font:500 15px var(--sans);text-align:center;transition:.22s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

(() => {
  const view = $('#iView'), p = $('#iPages'), ind = $('#iInd');
  let sx = 0, sy = 0, dx = 0, t0 = 0, down = false, lock = null, moved = false;
  view.addEventListener('pointerdown', e => {
    if ((e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('input, #cTool, .cot-top')) return;
    const cb = e.target.closest('#chartBox');
    if (cb) {                                  // the chart pans itself; a swipe that starts on the price scale (right edge) turns the page
      let edge = 56; try { edge = Math.max(edge, CH.chart.priceScale('right').width()); } catch (err) {}
      if (e.clientX < cb.getBoundingClientRect().right - edge) return;
    }
    down = true; lock = null; moved = false; dx = 0; sx = e.clientX; sy = e.clientY; t0 = performance.now();
  });
  view.addEventListener('pointermove', e => {
    if (!down) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!lock && Math.hypot(mx, my) > 8) {
      lock = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
      if (lock === 'x') { try { view.setPointerCapture(e.pointerId); } catch {} p.style.transition = ind.style.transition = 'none'; }
    }
    if (lock !== 'x') return;
    dx = mx;
    if ((state.itab === 0 && dx > 0) || (state.itab === 3 && dx < 0)) dx *= .3;   // rubber band at the ends
    p.style.transform = `translateX(calc(${-state.itab*100}% + ${dx}px))`;
    ind.style.transform = `translateX(calc(${state.itab*100}% + ${-dx * ind.offsetWidth / view.clientWidth}px))`;
  });
  const end = () => {
    if (!down) return; down = false;
    if (lock !== 'x') return;
    moved = true;
    const w = view.clientWidth, fast = performance.now() - t0 < 280 && Math.abs(dx) > 40;
    let n = state.itab;
    if (dx < -w*.25 || (fast && dx < 0)) n++;
    if (dx >  w*.25 || (fast && dx > 0)) n--;
    p.style.transition = ind.style.transition = '';
    goTab(Math.max(0, Math.min(3, n)));
  };
  view.addEventListener('pointerup', end);
  view.addEventListener('pointercancel', end);
  view.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();

function genBars(i, tf){
  let seed = [...(i.s + '|' + tf)].reduce((a, ch) => (a*31 + ch.charCodeAt(0)) >>> 0, 11);
  const rnd = () => (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296, g = () => (rnd() + rnd() + rnd() - 1.5) * 2;   // ~N(0, 1)
  const N = 300, now = Date.now() / 1000, t1 = Math.floor(now / tf) * tf, day = Math.floor(now / 86400) * 86400;
  const sig = DVOL[i.c] * Math.sqrt(tf / 86400) * .9, ph = rnd() * 6.28, L = Array(N);
  L[N-1] = Math.log(i.bid);
  for (let k = N-1; k > 0; k--) L[k-1] = L[k] - (g()*sig + sig*.18*Math.sin(k/23 + ph));
  const times = L.map((_, k) => t1 - (N-1-k) * tf);
  // the close before today's first bar is today's open, so the chart shows the same day change as the header
  const d = times.findIndex(t => t >= day);
  if (d > 0) { const dl = Math.log(i.open) - L[d-1], span = N - d; for (let k = 0; k < N; k++) L[k] += k <= d-1 ? dl : dl * (N-1-k) / span; }
  const vb = VB[i.c] * Math.sqrt(tf / 60), part = (now - t1) / tf;
  return times.map((t, k) => {
    const c = k === N-1 ? i.bid : Math.exp(L[k]), o = k ? Math.exp(L[k-1]) : c * Math.exp(-g()*sig*.5);
    const h = Math.max(o, c) * Math.exp(Math.abs(g())*sig*.45), l = Math.min(o, c) * Math.exp(-Math.abs(g())*sig*.45);
    const v = vb * (.45 + rnd()) * (1 + Math.abs(Math.log(c / o)) / sig) * (k === N-1 ? Math.max(.05, part) : 1);
    return {time:t, open:rp(o, i), high:rp(h, i), low:rp(l, i), close:rp(c, i), v:Math.round(v)};
  });
}

  if (k === 'sma50') return [smaAt(cl, x, 50)];
