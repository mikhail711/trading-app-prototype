  const m = smaAt(cl, x, 20); if (m == null) return [null, null, null];          // Bollinger 20, 2
  let v = 0; for (let j = x - 19; j <= x; j++) v += (cl[j] - m) ** 2;
  const w = 2 * Math.sqrt(v / 20); return [m + w, m, m - w];
}

/* series on the chart */
function scaleFit(){ CH.chart.priceScale('right').applyOptions({scaleMargins:{top:.13, bottom:state.chart.ind.vol ? .2 : .06}}); }
// the price scale also takes in the levels being set right now (order bar and ticket drafts), so they are on screen to drag
function draftLevels(){
  if (!CH.sym || CH.sym !== state.inst) return [];
  const c = state.cot, tk = state.tk, sh = state.chart.show, L = [];
  if (sh.sltp) L.push(c.sl, c.tp, tk && tk.sl, tk && tk.tp);
  if (sh.ord && c.type === 'pending' && c.pxOn) L.push(c.px.buy);
  if (sh.ord && tk && tk.type === 'pending') L.push(tk.price);
  return L.filter(v => v != null && isFinite(v) && v > 0);
}
function draftScale(orig){
  const r = orig(), lv = draftLevels();
  if (!r || !r.priceRange || !lv.length) return r;
  return {...r, priceRange:{minValue:Math.min(r.priceRange.minValue, ...lv), maxValue:Math.max(r.priceRange.maxValue, ...lv)}};
}
function addMain(){
  const t = state.chart.type, i = BY[CH.sym], ba = state.chart.show.ba, c = CH.chart;
  const o = {priceLineVisible:!ba, lastValueVisible:!ba, priceFormat:{type:'price', precision:i.dg, minMove:10 ** -i.dg}, autoscaleInfoProvider:draftScale};
  CH.main = t === 'line' ? c.addLineSeries({...o, color:'#4772F5', lineWidth:2})
    : t === 'area' ? c.addAreaSeries({...o, lineColor:'#4772F5', topColor:'rgba(71,114,245,.3)', bottomColor:'rgba(71,114,245,0)', lineWidth:2})
    : t === 'bars' ? c.addBarSeries({...o, upColor:UP, downColor:DN, thinBars:false})
    : c.addCandlestickSeries({...o, upColor:UP, downColor:DN, borderUpColor:UP, borderDownColor:DN, wickUpColor:UP, wickDownColor:DN});
  CH.ha = [];
  CH.main.setData(CH.bars.map((_, x) => mainPt(x)));
  CH.lines.clear();
}
function addVol(){
  CH.vol = CH.chart.addHistogramSeries({priceFormat:{type:'volume'}, priceScaleId:'vol', lastValueVisible:false, priceLineVisible:false});
  CH.chart.priceScale('vol').applyOptions({scaleMargins:{top:.82, bottom:0}});
  CH.vol.setData(CH.bars.map(volPt));
}
function addInd(k){
  const col = CIND.find(x => x[0] === k)[2], cl = CH.bars.map(q => q.close), n = k === 'bb' ? 3 : 1, out = Array.from({length:n}, () => []);
  if (k === 'ema200') CH.ema = emaArr(cl, 200);
  CH.bars.forEach((q, x) => indAt(k, cl, x).forEach((v, j) => { if (v != null) out[j].push({time:q.time, value:v}); }));
  // indicators never stretch the price scale: it fits the candles, a far-off EMA 200 just leaves the view
  const o = {color:col, lineWidth:1, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false, autoscaleInfoProvider:() => null};
  CH.ind[k] = out.map((d, j) => { const se = CH.chart.addLineSeries(k === 'bb' && j === 1 ? {...o, lineStyle:LightweightCharts.LineStyle.Dotted} : o); se.setData(d); return se; });
}
function delInd(k){ (CH.ind[k] || []).forEach(se => CH.chart.removeSeries(se)); delete CH.ind[k]; }
function chartInd(k, on){
  if (!CH.main) return;
  if (k === 'vol') { if (on) addVol(); else if (CH.vol) { CH.chart.removeSeries(CH.vol); CH.vol = null; } scaleFit(); }
  else if (on) addInd(k); else delInd(k);
}
function chartType(){                         // swap the main series; indicators are re-added so they stay on top
  if (!CH.main) return;
  Object.keys(CH.ind).forEach(delInd);
  CH.chart.removeSeries(CH.main);
  addMain();
  CIND.forEach(([k]) => { if (k !== 'vol' && state.chart.ind[k]) addInd(k); });
  drawRender(); syncLines();
}

function chartInit(){
  if (CH.chart) return true;
  const box = $('#chartBox');
  if (!window.LightweightCharts) {
    if (!box.querySelector('.c-err')) box.insertAdjacentHTML('beforeend', '<div class="c-err">The chart library did not load. Check the connection and open the instrument again.</div>');
    return false;
  }
  const LC = LightweightCharts, ax = {color:'#42424D', labelBackgroundColor:'#26262C'};
  CH.chart = LC.createChart(box, {
    autoSize:true,
    layout:{background:{type:'solid', color:'#000000'}, textColor:'#9191A1', fontFamily:"'Geist Mono', ui-monospace, monospace", fontSize:11, attributionLogo:true},
    grid:{vertLines:{color:'#1a1a20'}, horzLines:{color:'#1a1a20'}},
    rightPriceScale:{borderColor:'#26262C'},
    timeScale:{borderColor:'#26262C', timeVisible:true, secondsVisible:false, rightOffset:4, barSpacing:7},
    crosshair:{mode:LC.CrosshairMode.Normal, vertLine:ax, horzLine:ax},
    handleScroll:CH_SCROLL, handleScale:CH_SCALE,
  });
  CH.chart.subscribeCrosshairMove(e => { CH.hover = !!(e && e.time != null && e.point); legend(CH.hover ? e.time : null); });
  CH.chart.timeScale().subscribeVisibleLogicalRangeChange(r => $('#cLive').classList.toggle('on', !!r && r.to < CH.bars.length - 3));
  // double tap resets the view (pinches and drags are ignored)
  let n = 0, multi = false, x0 = 0, y0 = 0, tap = 0, tx = 0, ty = 0;
  box.addEventListener('pointerdown', e => { n++; if (n > 1) multi = true; x0 = e.clientX; y0 = e.clientY; });
  const up = e => {
    n = Math.max(0, n - 1);
    if (multi) { if (!n) multi = false; tap = 0; return; }
    if (CH.tapUsed || e.target.closest('.c-pop, .c-tbar')) { CH.tapUsed = CH.wasOpen = false; tap = 0; return; }
    if (e.type !== 'pointerup' || Math.hypot(e.clientX - x0, e.clientY - y0) > 10) { CH.wasOpen = false; tap = 0; return; }
    const r = box.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    if (state.draw.tool) { drawTap(px, py); tap = 0; return; }
    const t = performance.now();
    if (t - tap < 320 && Math.hypot(e.clientX - tx, e.clientY - ty) < 30) { hideTbar(); chartReset(); tap = 0; return; }
    tap = t; tx = e.clientX; ty = e.clientY;
    if (CH.wasOpen) { CH.wasOpen = false; return; }
    if (py <= r.height - CH.chart.timeScale().height()) showTbar(px, py);
  };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  return true;
}
function chartReset(){ if (!CH.chart) return; CH.chart.timeScale().resetTimeScale(); CH.chart.priceScale('right').applyOptions({autoScale:true}); }

function chartLoad(i){                        // new instrument or timeframe: fresh history, same chart object
  if (!chartInit()) return;
  hidePop(); hideTbar();
  const c = CH.chart;
  if (CH.vol) c.removeSeries(CH.vol), CH.vol = null;
  Object.keys(CH.ind).forEach(delInd);
  if (CH.main) c.removeSeries(CH.main), CH.main = null;
  CH.sym = i.s; CH.bars = genBars(i, tfSec()); CH.ema = []; CH.hover = false;
  c.applyOptions({localization:{priceFormatter:v => fmt(v, i.dg)}, timeScale:{timeVisible:state.chart.tf !== 'D'}});
  if (state.chart.ind.vol) addVol();
  addMain();
  CIND.forEach(([k]) => { if (k !== 'vol' && state.chart.ind[k]) addInd(k); });
  scaleFit(); chartReset(); legend(null); drawRender(); syncLines();
}

/* live: the last bar follows the bid; a new bar starts when the timeframe rolls over */
function chartTick(i){
  if (!CH.main || CH.sym !== i.s) return;
  const tf = tfSec(), b = CH.bars, now = Date.now() / 1000;
  let q = b[b.length-1];
  if (now >= q.time + tf) b.push(q = {time:Math.floor(now / tf) * tf, open:q.close, high:Math.max(q.close, i.bid), low:Math.min(q.close, i.bid), close:i.bid, v:0});
  else { q.close = i.bid; q.high = Math.max(q.high, i.bid); q.low = Math.min(q.low, i.bid); }
  q.v += Math.round(VB[i.c] * Math.sqrt(tf / 60) * Math.random() * .06);
  const x = b.length - 1, cl = b.map(z => z.close);
  CH.main.update(mainPt(x));
  if (CH.vol) CH.vol.update(volPt(q));
  for (const k in CH.ind) {
    if (k === 'ema200') CH.ema[x] = (CH.ema[x-1] ?? cl[x]) * (1 - 2/201) + cl[x] * 2/201;
    indAt(k, cl, x).forEach((v, j) => { if (v != null) CH.ind[k][j].update({time:q.time, value:v}); });
  }
  if (!CH.hover) legend(null);
  syncLines();
}

/* legend: the bar under the crosshair, or the last bar */
function legend(t){
  const b = CH.bars; if (!b.length) return;
  const i = BY[CH.sym], f = v => fmt(v, i.dg);
  let x = b.length - 1;
  if (t != null) { let lo = 0, hi = x; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (b[m].time <= t) lo = m; else hi = m - 1; } x = lo; }
  const q = b[x], ch = (q.close / (x ? b[x-1].close : q.open) - 1) * 100;
  $('#cLegend').innerHTML = `<span class="lg1"><b>${i.s}</b> · ${tfLabel()} · <span class="${ch >= 0 ? 'up' : 'dn'}">${pct(ch)}</span></span>`
    + `<span>O <em>${f(q.open)}</em></span><span>H <em>${f(q.high)}</em></span><span>L <em>${f(q.low)}</em></span><span>C <em>${f(q.close)}</em></span>`;
}

/* trading levels: Bid / Ask, open positions with live P&L, their SL / TP, pending orders,
   and drafts from the order bar under the chart and from the Ticket tab.
   SL / TP and pending prices carry a drag descriptor: o[k] is the level, side() / ref() keep SL and TP on their side. */
function wantLines(){
  const i = BY[CH.sym], sh = state.chart.show, D = LightweightCharts.LineStyle, L = [], c = state.cot, tk = state.tk;
  const usdS = v => (v >= 0 ? '+' : '−') + '$' + fmt(Math.abs(v), 2);
  const legT = (label, lv, e, lots, side) => `${label} · ${usdS((lv - e) * lots * CS[i.c] * (side === 'buy' ? 1 : -1))}`;
  const mkt = side => side === 'buy' ? i.bid : ask(i);           // where an open position closes
  if (sh.ba) L.push({id:'bid', price:i.bid, color:DN, style:D.Dashed, title:'Bid'}, {id:'ask', price:ask(i), color:'#4772F5', style:D.Dashed, title:'Ask'});
  for (const q of ACC.positions) if (q.s === i.s) {
    if (sh.pos) L.push({id:'p' + q.id, price:q.entry, color:q.side === 'buy' ? UP : DN, style:D.Solid, width:2, title:`${q.side.toUpperCase()} ${fmt(q.lots, 2)} · ${usdS(posPL(q))}`});
    for (const [k, col] of [['sl', DN], ['tp', UP]]) if (sh.sltp && q[k] != null)
      L.push({id:'p' + k[0] + q.id, price:q[k], color:col, style:D.LargeDashed, title:legT(k.toUpperCase(), q[k], q.entry, q.lots, q.side),
        drag:{o:q, k, kind:'pos', side:() => q.side, ref:() => mkt(q.side), redraw:syncLines}});
  }
  if (sh.ord) for (const o of ACC.orders) if (o.s === i.s) {
    L.push({id:'o' + o.id, price:o.price, color:'#4772F5', style:D.Dashed, title:`${o.side.toUpperCase()} ${o.kind === 'limit' ? 'LMT' : 'STP'} ${fmt(o.lots, 2)}`,
      drag:{o, k:'price', kind:'ord', redraw:syncLines}});
    for (const [k, col] of [['sl', '#a8505a'], ['tp', '#3f9a86']]) if (sh.sltp && o[k] != null)
      L.push({id:'o' + k[0] + o.id, price:o[k], color:col, style:D.SparseDotted, title:legT(k.toUpperCase(), o[k], o.price, o.lots, o.side),
        drag:{o, k, kind:'ord', side:() => o.side, ref:() => o.price, redraw:syncLines}});
  }
  if (sh.ord && c && c.type === 'pending' && c.pxOn) {
    const full = cotFull(), sd = c.side;
    L.push({id:'cpx', price:c.px.buy, color:full ? '#7d8cf5' : sd === 'buy' ? '#4aa893' : '#b0646d', style:D.Dashed,
      title:full ? 'Order price' : `New ${sd.toUpperCase()} ${cotKind(i, sd) === 'limit' ? 'LMT' : 'STP'} ${fmt(c.lots, 2)}`,
      drag:{o:c.px, k:'buy', kind:'cot', redraw:cotApply, set:v => cotSetPx(v)}});
  }
  if (sh.sltp && c) for (const [k, col] of [['sl', '#b0646d'], ['tp', '#4aa893']]) if (c[k] != null)
    L.push({id:'c' + k[0], price:c[k], color:col, style:D.Dotted, title:legT('New ' + k.toUpperCase(), c[k], cotEntry(), c.lots, c.side),
      drag:{o:c, k, kind:'cot', side:() => c.side, ref:cotEntry, redraw:cotApply}});
  for (const d of CH.draws[CH.sym] || []) {
    if (d.type === 'hline') L.push({id:'h' + d.id, price:d.price, color:'#d9b54a', style:D.Solid, title:'', drag:{o:d, k:'price', kind:'draw', redraw:syncLines}});
    if (d.type === 'fib') FIB.forEach(f => L.push({id:`f${d.id}_${f}`, price:d.b.price + (d.a.price - d.b.price) * f, color:f === 0 || f === 1 ? '#8b95a5' : '#5b7fb8', style:D.Solid, title:String(f), axis:false}));
  }
  for (const a of CH.alerts[CH.sym] || []) L.push({id:'al' + a.id, price:a.price, color:'#e6c235', style:D.Dashed, title:'Alert',
    drag:{o:a, k:'price', kind:'draw', redraw:() => { a.above = a.price > i.bid; syncLines(); }}});
  if (CH.tapPx != null) L.push({id:'tap', price:CH.tapPx, color:'#9191A1', style:D.Dotted, title:''});
  if (state.draw.pts.length) L.push({id:'dp', price:state.draw.pts[0].price, color:'#d9b54a', style:D.Dotted, title:'1st point', axis:false});
  if (tk) {
    if (tk.type === 'pending' && tk.price) L.push({id:'kp', price:tk.price, color:'#7d8cf5', style:D.Dotted, title:`Ticket ${pendKind() === 'stop' ? 'STP' : 'LMT'}`,
      drag:{o:tk, k:'price', kind:'tk', redraw:updateTicket}});
    for (const [k, col] of [['sl', '#b0646d'], ['tp', '#4aa893']]) if (sh.sltp && tk[k] != null)
      L.push({id:'k' + k[0], price:tk[k], color:col, style:D.Dotted, title:legT('Ticket ' + k.toUpperCase(), tk[k], entry(), tk.lots, tk.side),
        drag:{o:tk, k, kind:'tk', side:() => tk.side, ref:entry, redraw:updateTicket}});
  }
  return L;
}
function syncLines(){
  if (!CH || !CH.main || CH.sym !== state.inst) return;
  const seen = new Set(); CH.drag.clear();
  for (const w of wantLines()) {
    seen.add(w.id);
    if (w.drag) CH.drag.set(w.id, w.drag);
    const o = {price:w.price, color:w.color, lineWidth:CH.dragId === w.id ? 3 : w.width || 1, lineStyle:w.style, axisLabelVisible:w.axis !== false, title:w.title};
    const ln = CH.lines.get(w.id);
    if (ln) ln.applyOptions(o); else CH.lines.set(w.id, CH.main.createPriceLine(o));
  }
  for (const [id, ln] of CH.lines) if (!seen.has(id)) { CH.main.removePriceLine(ln); CH.lines.delete(id); }
  const sig = draftLevels().join();           // a draft level changed: refit the scale now (not on the next tick)
  if (sig !== CH.draftSig && !CH.dragId) { CH.draftSig = sig; CH.main.update(mainPt(CH.bars.length - 1)); }
}

/* drag a level with a finger or the mouse: grab within a few px of the line (or its label on the price scale),
   the chart stops panning for that gesture, the level follows and is saved where it belongs */
function dragSet(d, v){
  const i = BY[CH.sym], t = 10 ** -i.dg;
  v = rp(Math.max(t, v), i);
  if (d.set) { d.set(v); d.redraw(); return; }
  if (d.k === 'price') {                      // a pending price drags its SL / TP along
    const dl = v - d.o.price; d.o.price = v;
    if (d.o.sl != null) d.o.sl = rp(d.o.sl + dl, i);
    if (d.o.tp != null) d.o.tp = rp(d.o.tp + dl, i);
    if (d.kind === 'ord') d.o.kind = d.o.side === 'buy' ? (v < ask(i) ? 'limit' : 'stop') : (v > i.bid ? 'limit' : 'stop');
  } else {                                    // SL / TP never cross to the wrong side of the market / entry
    const ref = d.ref(), below = (d.k === 'sl') === (d.side() === 'buy');
    d.o[d.k] = below ? Math.min(v, rp(ref - t, i)) : Math.max(v, rp(ref + t, i));
  }
  d.redraw();
}
/* what a tap on a level offers: positions close, orders cancel, SL / TP and drafts are removed, everything is editable */
function lineAct(id){
  const m = id.match(/^([a-z]+)(\d*)$/); if (!m || !CH.sym) return null;
  const i = BY[CH.sym], f = v => fmt(v, i.dg), [, t, n] = m, num = +n;
  const q = ACC.positions.find(x => x.id === num), o = ACC.orders.find(x => x.id === num), c = state.cot, tk = state.tk;
  const leg = k => k === 'sl' ? 'stop loss' : 'take profit', K = t.slice(-1) === 's' ? 'sl' : 'tp';
  const done = () => { syncLines(); if (phone.classList.contains('trd-open')) renderTrades(); };
  const edit = target => ({l:'Edit SL / TP', ic:I.edit, run:() => openSltp(target)});
  const drop = (obj, k, after) => ({l:`Remove ${leg(k)}`, ic:I.trash, dg:true, run:() => { obj[k] = null; after(); }});
  if (t === 'p' && q) return {title:`${q.side.toUpperCase()} ${fmt(q.lots, 2)} ${q.s} · ${sUsd(posPL(q))}`,
    items:[edit({kind:'pos', id:q.id}), {l:'Close position', ic:I.x, dg:true, run:() => closePosition(q.id)}]};
  if ((t === 'ps' || t === 'pt') && q && q[K] != null) return {title:`${K.toUpperCase()} ${f(q[K])} · ${q.side.toUpperCase()} ${fmt(q.lots, 2)} ${q.s}`,
    items:[edit({kind:'pos', id:q.id}), drop(q, K, () => { toast(`${q.s} ${leg(K)} removed`); done(); })]};
  if (t === 'o' && o) return {title:`${o.side.toUpperCase()} ${o.kind.toUpperCase()} ${fmt(o.lots, 2)} ${o.s} · ${f(o.price)}`,
    items:[edit({kind:'ord', id:o.id}), {l:'Cancel order', ic:I.x, dg:true, run:() => cancelOrder(o.id)}]};
  if ((t === 'os' || t === 'ot') && o && o[K] != null) return {title:`${K.toUpperCase()} ${f(o[K])} · ${o.side.toUpperCase()} ${o.kind.toUpperCase()} ${o.s}`,
    items:[edit({kind:'ord', id:o.id}), drop(o, K, () => { toast(`${o.s} order ${leg(K)} removed`); done(); })]};
  if ((t === 'cs' || t === 'ct') && c[K] != null) return {title:`New ${K.toUpperCase()} ${f(c[K])}`, items:[edit({kind:'cot'}), drop(c, K, cotApply)]};
  if ((t === 'ks' || t === 'kt') && tk && tk[K] != null) return {title:`Ticket ${K.toUpperCase()} ${f(tk[K])}`, items:[drop(tk, K, renderTicket)]};
  if (t === 'cpx' && c.pxOn) {                // the order bar's pending price
    const sd = c.side;
    return {title:cotFull() ? `Order price · ${f(c.px.buy)}` : `New ${sd.toUpperCase()} ${cotKind(i, sd).toUpperCase()} ${fmt(c.lots, 2)} · ${f(c.px.buy)}`,
      items:[{l:'Remove from chart', ic:I.trash, dg:true, run:() => { c.pxOn = false; c.px = {buy:ask(i), sell:i.bid}; cotApply(); }}]};
  }
  if (t === 'al') {
    const list = CH.alerts[CH.sym] || [], a = list.find(x => x.id === num);
    return a ? {title:`Alert · ${f(a.price)}`, items:[{l:'Remove alert', ic:I.trash, dg:true, run:() => { list.splice(list.indexOf(a), 1); toast('Alert removed'); }}]} : null;
  }
  if (t === 'h') {
    const list = CH.draws[CH.sym] || [], d = list.find(x => x.id === num);
    return d ? {title:`Horizontal line · ${f(d.price)}`, items:[{l:'Remove line', ic:I.trash, dg:true, run:() => { list.splice(list.indexOf(d), 1); syncLines(); }}]} : null;
  }
  return null;
}
const tappable = id => /^(p|ps|pt|o|os|ot|h|al)\d+$|^(cs|ct|ks|kt|cpx)$/.test(id);
function showPop(id){
  const a = lineAct(id), ln = CH.lines.get(id); if (!a || !ln) return;

function showTbar(x, y){

function hideTbar(){ const el = $('#cTbar'); if (el) el.classList.remove('on'); if (CH.tapPx != null) { CH.tapPx = null; syncLines(); } }
// what each button places at the tapped price
function tbPlace(what, v){
  const c = state.cot, i = BY[state.inst], t = 10 ** -i.dg;
  if (what === 'alert') {
    (CH.alerts[i.s] ||= []).push({id:++CH.alertN, price:v, above:v > i.bid});
    toast(`Alert set at ${fmt(v, i.dg)}`); syncLines(); return;
  }

    c.type = 'pending'; cotSetPx(v); c.pxOn = true;

}

function dragDone(d){

(() => {
  const box = $('#chartBox'); let g = null;
  const paneY = e => { const r = box.getBoundingClientRect(); return [e.clientY - r.top, r.height - CH.chart.timeScale().height()]; };
  const hit = e => {                          // the nearest draggable or tappable level within a few px
    if (!CH.main || !CH.lines.size) return null;
    const [y, h] = paneY(e), tol = e.pointerType === 'mouse' ? 7 : 14;
    if (y < 0 || y > h) return null;
    let best = null;
    for (const [id, ln] of CH.lines) {
      if (!CH.drag.has(id) && !tappable(id)) continue;
      const c = CH.main.priceToCoordinate(ln.options().price); if (c == null) continue;
      const dist = Math.abs(c - y);
      if (dist <= tol && (!best || dist < best.dist)) best = {id, d:CH.drag.get(id) || null, dist};
    }
    return best;
  };
  box.addEventListener('pointerdown', e => {
    if (e.target.closest('.c-pop, .c-tbar')) return;   // taps inside the menu / toolbar
    CH.wasOpen = !!CH.pop || CH.tapPx != null;
    hidePop(); hideTbar();
    if (e.button > 0 || state.draw.tool) return;
    const h = hit(e); if (!h) return;
    g = {id:h.id, d:h.d, pid:e.pointerId, x:e.clientX, y:e.clientY, moved:false};
    if (!h.d) return;                         // tap-only level (an open position): a drag over it still pans the chart
    g.auto = CH.chart.priceScale('right').options().autoScale;
    CH.dragId = h.id;
    CH.chart.applyOptions({handleScroll:false, handleScale:false});
    CH.chart.priceScale('right').applyOptions({autoScale:false});
    try { box.setPointerCapture(e.pointerId); } catch {}
    e.preventDefault(); e.stopPropagation();
    syncLines();
  }, true);
  box.addEventListener('pointermove', e => {
    if (!g) {
      if (e.pointerType === 'mouse' && !e.buttons && !e.target.closest('.c-pop')) { const h = hit(e); box.classList.toggle('c-grab', !!(h && h.d)); box.classList.toggle('c-tap', !!(h && !h.d)); }
      return;
    }
    if (e.pointerId !== g.pid) return;
    if (!g.moved && Math.hypot(e.clientX - g.x, e.clientY - g.y) < 5) return;   // still a tap
    g.moved = true;
    if (!g.d) { g = null; return; }
    const [y, h] = paneY(e), v = CH.main.coordinateToPrice(Math.max(4, Math.min(y, h - 4)));
    if (v != null) dragSet(g.d, v);
  }, true);
  const end = (e, cancel) => {
    if (!g || e.pointerId !== g.pid) return;
    const {id, d, moved, auto} = g; g = null; CH.dragId = null;
    if (d) { CH.chart.applyOptions({handleScroll:CH_SCROLL, handleScale:CH_SCALE}); CH.chart.priceScale('right').applyOptions({autoScale:auto}); }
    box.classList.remove('c-grab', 'c-tap');
    syncLines();
    CH.tapUsed = true;                        // this gesture is ours: not a chart tap / double tap
    if (cancel) return;
    if (!moved) showPop(id);                  // a tap: the level's menu
    else if (d) dragDone(d);
  };
  box.addEventListener('pointerup', e => end(e, false), true);
  box.addEventListener('pointercancel', e => end(e, true), true);
  box.addEventListener('pointerleave', () => { if (!g) box.classList.remove('c-grab', 'c-tap'); });
})();

  CH.trendS.forEach(se => CH.chart.removeSeries(se)); CH.trendS = [];

const tpDef = () => rp(entry() * (state.tk.side === 'buy' ? 1.02 : .98), BY[state.inst]);
const units = () => +(state.tk.lots * CS[BY[state.inst].c]).toFixed(2);
const legPL = k => (state.tk[k] - entry()) * units() * (state.tk.side === 'buy' ? 1 : -1);

// what the ticket's trade can lose: at the SL, or with no SL until Stop Out (margin used reaches 144% of equity; a buy can't lose more than its value)
function tkMaxRisk(){
  const t = state.tk, i = BY[state.inst], e = entry(), u = units();
  if (t.sl != null) return Math.abs(legPL('sl'));
  const loss = Math.max(0, ACC.balance + pnl() - (margin() + u * e * parseFloat(i.mg) / 100) / 1.44);
  return t.side === 'buy' ? Math.min(loss, u * e) : loss;

// Risk (kept in $) + SL set: the volume is whatever loses the risk at the SL, rounded down to 0.01 lot

  const d = Math.abs(entry() - t.sl) * CS[BY[state.inst].c];

function slCtx(){

    const gl = -sum(L.filter(t => t.pnl < 0).map(t => t.pnl)) || 1, la = -sum(A.filter(t => t.pnl < 0).map(t => t.pnl));
    const age = t => (Date.now() - t.at) / 864e5, rec = A.filter(t => age(t) <= 7).length, prev = A.filter(t => age(t) > 7 && age(t) <= 14).length;
    return {id, title, A, O, pl, avg, avgO, tradeShare:Math.round(A.length / L.length * 100), lossShare:Math.round(la / gl * 100),

  L.forEach(t => { const h = Math.floor(opened(t).getUTCHours() / 2) * 2; (win[h] ||= []).push(t); });
  const worst = Object.entries(win).map(([h, A]) => ({h:+h, A, pl:sum(A.map(t => t.pnl))})).sort((a, b) => a.pl - b.pl)[0];

function trdFills(){
  const F = [];
  CLOSED.forEach(t => {
    F.push({s:t.s, side:t.side, lots:t.lots, price:t.open, at:new Date(t.at - t.dur * 6e4), what:'Open'});
    F.push({s:t.s, side:t.side === 'buy' ? 'sell' : 'buy', lots:t.lots, price:t.close, at:t.at, what:'Close', pl:t.pnl});
  });
  ACC.positions.forEach(q => F.push({s:q.s, side:q.side, lots:q.lots, price:q.entry, at:q.at, what:'Open'}));
  F.sort((a, b) => b.at - a.at);
  return `<div class="lsum"><span>${F.length} executions</span><span>last 90 days</span></div><div class="scr-list">` + F.map(f => { const i = BY[f.s]; return `<button class="row" data-a="open:${f.s}">${icon(i)}
    <span class="nm"><span class="sym">${f.s}</span><span class="desc"><span class="sd-${f.side}">${cap(f.side)}</span> ${fmt(f.lots, 2)} · ${f.what}${f.pl != null ? ` · <span class="${cls(f.pl)}">${sUsd(f.pl)}</span>` : ''}</span></span>
    <span class="px"><span class="price">${fmt(f.price, i.dg)}</span><span class="chg" style="color:var(--muted)">${stamp(f.at)}</span></span></button>`; }).join('') + '</div>';
}
function realize(q, lots){          // closes `lots` of position q at the market; P&L goes to the balance and to Closed Positions
  const i = BY[q.s], pl = +(posPL(q) * lots / q.lots).toFixed(2);
  CLOSED.push({s:q.s, side:q.side, lots, open:q.entry, close:q.side === 'buy' ? i.bid : ask(i), pnl:pl, at:new Date(), dur:Math.max(1, Math.round((Date.now() - q.at) / 6e4)), sl:q.sl, tp:q.tp});
  ACC.balance = +(ACC.balance + pl).toFixed(2);
  return pl;
}
function closePosition(id){
  const k = ACC.positions.findIndex(q => q.id === id); if (k < 0) return;
  const q = ACC.positions[k], pl = realize(q, q.lots);
  ACC.positions.splice(k, 1);
  toast(`${q.s} closed · ${sUsd(pl)}`);
  updateBadge(); renderTrades();
}
function partialClose(id){
  const q = ACC.positions.find(x => x.id === id); if (!q) return;
  const half = Math.floor(q.lots * 50) / 100;
  if (half < .01 || q.lots - half < .01) { toast('Too small to split · the minimum is 0.01 lots'); return; }
  const pl = realize(q, half);
  q.lots = +(q.lots - half).toFixed(2);
  toast(`Closed ${fmt(half, 2)} lots of ${q.s} · ${sUsd(pl)}`);
  renderTrades();
}
function breakEven(id){
  const q = ACC.positions.find(x => x.id === id); if (!q) return;
  q.sl = q.entry;
  toast(`${q.s} stop loss moved to entry ${fmt(q.entry, BY[q.s].dg)}`);
  renderTrades();
}
function cancelOrder(id){
  const k = ACC.orders.findIndex(o => o.id === id); if (k < 0) return;
  const o = ACC.orders.splice(k, 1)[0];

  updateBadge(); renderTrades();
}
function closeAll(){
  if (state.trdTab === 'pending') { const n = ACC.orders.length; ACC.orders.length = 0; toast(`${n} pending order${n === 1 ? '' : 's'} cancelled`); }
  else { const n = ACC.positions.length, pl = ACC.positions.reduce((x, q) => x + realize(q, q.lots), 0); ACC.positions.length = 0; toast(`${n} position${n === 1 ? '' : 's'} closed · ${sUsd(pl)}`); }

}

      if (d > 0) body.scrollBy({top:Math.min(d, cb.top - bb.top - 8), behavior:'smooth'});
    }, 340);
  }
  if (a === 'ord-cancel') cancelOrder(+v);
  if (a === 'ins-tab') { state.insTab = v; renderInsights(); }
  if (a === 'scr-close') closeScanner();
  if (a === 'ms-mode') { state.msMode = v; renderScanner(); }
  if (a === 'ms-star') { state.msStar = !state.msStar; el.classList.toggle('on', state.msStar); el.setAttribute('aria-pressed', state.msStar); el.innerHTML = state.msStar ? I.starFill : I.star; }
  if (a === 'ms-pause') { state.msPaused = !state.msPaused; msCountdown(); toast(state.msPaused ? 'Auto-refresh paused' : 'Auto-refresh resumed'); }
  if (a === 'ms-market') openSheet('opts', {title:'Markets', sub:'Instruments the scanner covers', list:MS_MK.map(([k, l]) => [k, l, INS.filter(i => k === 'all' || i.c === k).length]), cur:state.msMarket, act:'ms-pick'});
  if (a === 'ms-pick') { state.msMarket = v; closeSheet(); renderScanner(); }
  if (a === 'ms-sort') openSheet('opts', {title:'Sort instruments', list:MS_SORT, cur:state.msSort, act:'ms-sortpick'});
  if (a === 'ms-sortpick') { state.msSort = v; closeSheet(); renderScanner(); }
  if (a === 'ms-dir') { state.msAsc = !state.msAsc; el.classList.toggle('asc', state.msAsc); renderMsList(); }
  if (a === 'mlevel') openDlg();
  if (a === 'dlg-close') closeDlg();
  if (a === 'scan-open') { openScreen(v, 'home'); goTab(3, true); }
  if (a === 'open') {
    if (phone.classList.contains('search-open')) {
      closeSearch();
      state.sMode === 'switch' ? setInst(v) : openScreen(v, 'search');
    } else if (phone.classList.contains('inst-open')) setInst(v);
    else openScreen(v, 'home');
  }
  if (a === 'switch') openSearch('switch', true);
  if (a === 'iclose') closeScreen();
  if (a === 'itab') goTab(+v);
  if (a === 'cot-step') {
    const c = state.cot, d = +v;
    if (c.risk) c.maxRisk = Math.max(1, Math.round((c.maxRisk + d * 10) / 10) * 10 || 1);
    else c.lots = Math.max(.01, +(c.lots + d * .01).toFixed(2));
    cotApply();
  }
  if (a === 'cot-type') { state.cot.type = state.cot.type === 'market' ? 'pending' : 'market'; cotApply(); }
  if (a === 'cot-opt') {
    if (v === 'risk') {                       // the max risk needs a stop loss to mean anything: put a default one in
      const c = state.cot; c.risk = !c.risk;
      if (c.risk && c.sl == null) c.sl = cotDef('sl');
    } else { if (state.cot[v] == null) state.cot[v] = cotDef(v); openSltp({kind:'cot'}); }   // same sheet as the ticket
    cotApply();
  }
  if (a === 'chart-tf') { state.chart.tf = v; chartSave(); renderCTool(); chartLoad(BY[state.inst]); }
  if (a === 'chart-set') openSheet('chart');
  if (a === 'tb') { const px = CH.tapPx; hideTbar(); if (px != null && v !== 'close') tbPlace(v, px); }
  if (a === 'pop' && CH.pop) { const it = CH.pop.items[+v]; hidePop(); if (it) it.run(); syncLines(); }
  if (a === 'draw-set') openSheet('draw');
  if (a === 'draw-tool') drawStart(v);
  if (a === 'draw-cancel') drawCancel();
  if (a === 'draw-clear') { CH.draws[state.inst] = []; closeSheet(); drawRender(); syncLines(); toast('Drawings removed'); }
  if (a === 'chart-type') { state.chart.type = v; chartSave(); chartType(); renderCTool(); refreshChartSheet(); }
  if (a === 'chart-ind') { const on = state.chart.ind[v] = !state.chart.ind[v]; chartSave(); chartInd(v, on); renderCTool(); refreshChartSheet(); }
  if (a === 'chart-show') {
    const ba = state.chart.show[v] = !state.chart.show[v]; chartSave();
    if (v === 'ba' && CH.main) CH.main.applyOptions({priceLineVisible:!ba, lastValueVisible:!ba});
    syncLines(); refreshChartSheet();
  }
  if (a === 'chart-live' && CH.chart) CH.chart.timeScale().scrollToRealTime();
  if (a === 'cot-clr') { if (v === 'risk') state.cot.risk = false; else state.cot[v] = null; cotApply(); }
  if (a === 'cot-side' && !cotFull()) {
    const c = state.cot; c.side = c.side === 'buy' ? 'sell' : 'buy';
    if (c.sl != null) c.sl = cotDef('sl');            // like the ticket: levels move to the new side
    if (c.tp != null) c.tp = cotDef('tp');
    cotApply();
  }
  if (a === 'side') { setSide(v); renderTicket(); }
  if (a === 'otype') { state.tk.type = v; if (v === 'pending') state.tk.price = defPrice(); renderTicket(); }
  if (a === 'step') { const [k, d] = v.split(':'); stepTk(k, +d); }
  if (a === 'tkriskmode') { state.tk.riskMode = v; renderTicket(); }
  if (a === 'tkriskclr') { state.tk.risk = null; updateTicket(); const f = $('#pTicket [data-tkrisk]'); if (f) f.focus({preventScroll:true}); }
  if (a === 'sltp') {
    state.slT = null; if (state.tk[v] == null) state.tk[v] = v === 'sl' ? slDef() : tpDef(); renderTicket(); openSheet('sltp');
    // focus the leg that was tapped right here, inside the tap: phones open the keyboard only for a focus made by the gesture itself
    const f = $(`#sheet [data-sl="${v}"]`);
    if (f) { f.focus({preventScroll:true}); const n = f.value.length; try { f.setSelectionRange(n, n); } catch (err) {} }
  }
  if (a === 'slpos') openSltp({kind:v[0] === 'p' ? 'pos' : 'ord', id:+v.slice(1)});
  if (a === 'slmode') {          // update in place: rebuilding the sheet would drop the focused field and close the keyboard
    const [k, m] = v.split(':'), c = slCtx(), act = document.activeElement, keep = act && act.dataset && act.dataset.sl ? act : null;
    if (c) {
      c.o[k + 'Mode'] = m;
      const row = $(`#sheet .slrow.${k}`), inp = row && row.querySelector('[data-sl]');
      if (row) {
        row.querySelectorAll('.unit button').forEach(b => { const on = b.dataset.a === `slmode:${k}:${m}`; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
        inp.placeholder = LEGPH[m][0]; inp.setAttribute('aria-label', `${k === 'sl' ? 'Stop loss' : 'Take profit'}, ${LEGPH[m][1]}`);
        if (c.o[k] != null) inp.value = m === 'pct' ? pctOf(k, c).toFixed(2) : fmt(c.o[k], c.i.dg);
      }
      slChanged();
      if (keep) { keep.focus({preventScroll:true}); const n = keep.value.length; try { keep.setSelectionRange(n, n); } catch (err) {} }
    }
  }
  if (a === 'slreset') { const c = slCtx(); if (c) c.o[v] = null; refreshSltp(); }   // no focus: on a phone it would pop the keyboard
  if (a === 'place') placeOrder();
  if (a === 'acct') openSheet('acc');
  if (a === 'fullscreen') toggleFs();
  if (a === 'a2hs-open') { closeMenu && closeMenu(); openSheet('a2hs'); }
  if (a === 'a2hs-skip') closeSheet();
  if (a === 'a2hs-install' && a2Defer) {
    const p = a2Defer; a2Defer = null; p.prompt();
    p.userChoice.then(r => { if (r.outcome === 'accepted') closeSheet(); else if (state.sheet && state.sheet.kind === 'a2hs') openSheet('a2hs'); });
  }
  if (a === 'close') { closeSheet(); closeDlg(); }
  if (a === 'toast') toast(v);
  if (a === 'search') openSearch('open', true);
  if (a === 'stab') { state.sTab = v; renderSearch(); $('#sRes').scrollTop = 0; }
  if (a === 'search-close') closeSearch();
  if (a === 'fav') {
    const on = !state.fav.has(v);
    on ? state.fav.add(v) : state.fav.delete(v);
    toast(on ? `${v} added to Favorites` : `${v} removed from Favorites`);
    render();
    if (phone.classList.contains('search-open')) renderSearch();
    if (phone.classList.contains('scr-open') && $('#msList')) renderMsList();
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (phone.classList.contains('dlg-open')) closeDlg();
  else if (phone.classList.contains('search-open')) closeSearch();
  else if (phone.classList.contains('sheet-open')) closeSheet();
  else if (phone.classList.contains('menu-open')) closeMenu();
  else if (phone.classList.contains('inst-open')) closeScreen();
  else if (phone.classList.contains('scr-open')) closeScanner();
  else if (phone.classList.contains('ins-open')) closeInsights();
  else if (phone.classList.contains('trd-open')) closeTrades();
});

/* ---------- live prices ---------- */
function flash(el, dir){
  el.classList.remove('fu','fd'); void el.offsetWidth; el.classList.add(dir > 0 ? 'fu' : 'fd');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('fu','fd'), 450);
}
function tick(i){
  const dir = Math.random() < .5 ? -1 : 1;
  const step = i.bid * (.00004 + Math.random() * .00022) * dir;
  i.bid = Math.max(i.lo * .99, +(i.bid + step).toFixed(i.dg));
  i.hi = Math.max(i.hi, i.bid); i.lo = Math.min(i.lo, i.bid);
  i.ch = (i.bid / i.open - 1) * 100;
  $$(`[data-p="${i.s}"]`).forEach(el => { el.textContent = fmt(i.bid, i.dg); flash(el, dir); });
  $$(`[data-c="${i.s}"]`).forEach(el => { el.textContent = pct(i.ch); el.classList.toggle('up', i.ch >= 0); el.classList.toggle('dn', i.ch < 0); });
  $$(`[data-mc="${i.s}"]`).forEach(el => { el.textContent = fmt(Math.abs(i.ch), 2) + '%'; el.classList.toggle('up', i.ch >= 0); el.classList.toggle('dn', i.ch < 0); });
  $$(`[data-cc="${i.s}"]`).forEach(el => { el.innerHTML = chgLine(i); el.classList.toggle('up', i.ch >= 0); el.classList.toggle('dn', i.ch < 0); });
  $$(`[data-bid="${i.s}"]`).forEach(el => el.textContent = fmt(i.bid, i.dg));
  $$(`[data-ask="${i.s}"]`).forEach(el => el.textContent = fmt(ask(i), i.dg));
  $$(`[data-r="${i.s}"]`).forEach(el => el.style.left = rangePos(i) + '%');
  alertCheck(i);
  if (i.s === state.inst && phone.classList.contains('inst-open')) {
    updateTicket();
    chartTick(i);
    cotLegs();
  }
}
function updateAccount(){
  const p = pnl(), eq = ACC.balance + p, el = $('#pnl');
  el.className = 'pnl ' + (p >= 0 ? 'up' : 'dn');
  el.innerHTML = (p >= 0 ? I.up : I.down) + fmt(Math.abs(p), 2);
  const mg = margin(), used = mg / eq * 100;
  $('#ringVal').textContent = Math.round(used);
  const arc = $('#ringArc');
  arc.setAttribute('stroke-dasharray', `${(used/100*122.5).toFixed(2)} 200`);
  arc.setAttribute('stroke-linecap', used >= 1 ? 'round' : 'butt');
  const set = (k, t, cls) => $$(`[data-acc="${k}"]`).forEach(x => { x.textContent = t; if (cls) x.className = cls; });
  set('eq', usd(eq)); set('pnl', (p >= 0 ? '+' : '') + usd(p), p >= 0 ? 'up' : 'dn');
  set('free', usd(eq - mg)); set('ml', used.toFixed(2) + '%');
  if (state.slT) updateSltpSheet();   // position SL/TP validity follows the live price
  set('ml2', used.toFixed(2) + '%'); $('#mlScale').style.setProperty('--x', Math.min(used, 144) / 144 * 100 + '%');
  set('upl', sUsd(p), 'v ' + cls(p)); set('mg', usd(mg)); set('eq2', usd(eq));
  ACC.positions.forEach(q => {
    const i = BY[q.s], v = posPL(q), cur = q.side === 'buy' ? i.bid : ask(i), c = v >= 0 ? 'up' : 'dn', d = Math.round((cur - q.entry) / 10 ** -i.dg);
    $$(`[data-pp="${q.id}"]`).forEach(x => { x.textContent = usd(v); x.dataset.s = c; });
    $$(`[data-pcur="${q.id}"]`).forEach(x => { x.textContent = fmt(cur, i.dg); x.className = c; });
    $$(`[data-pdiff="${q.id}"]`).forEach(x => { x.textContent = (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d); x.className = 'dpts ' + c; });
    $$(`[data-pexp="${q.id}"]`).forEach(x => x.textContent = usd(q.lots * CS[i.c] * cur));
  });
  ACC.orders.forEach(o => { const i = BY[o.s], d = Math.round((o.price - i.bid) / 10 ** -i.dg);
    $$(`[data-odiff="${o.id}"]`).forEach(x => x.textContent = (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d)); });
}
setInterval(() => {
  tick(BY.BTCUSD);
  for (let k = 0; k < 3; k++) tick(INS[1 + Math.floor(Math.random() * (INS.length - 1))]);
  if (phone.classList.contains('inst-open') && state.inst !== 'BTCUSD') tick(BY[state.inst]);
  updateAccount();
}, 1100);

render(true);
updateAccount();
